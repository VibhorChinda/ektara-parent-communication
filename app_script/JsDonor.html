<!-- JsDonor: Donor Communication screens. Pasted into Index.html by include_(). -->
<script>
// ================= Donor Communication workspace =================
const segTag = c => '<span class="seg ' + (String(c).charAt(0) === 'P' ? 'p' : '') + '" title="' + esc((state.dmeta && state.dmeta.segments[c]) || '') + '">' + esc(c) + '</span>';
/** The contacts CSV template: the header row only, in the names the upload understands. [column, what to put, required] */
const DONOR_CSV_COLS = [
  ['name', 'Full name of the person or organisation contact', true],
  ['segment', 'P0 (testing group), P1, P2, P3, P4, P5, D1 or D2', true],
  ['org', 'Company, foundation or trust'],
  ['contact number', 'Phone for WhatsApp, e.g. 98765 43210 or +44 7911 123456. Used to match an existing contact'],
  ['email', 'Email address. Matches an existing contact when there is no phone'],
  ['whatsapp_opt_in', 'yes or no (yes needs a phone number)'],
  ['email_opt_in', 'yes or no (yes needs an email address)'],
  ['contact_status', 'active or inactive (blank = active)'],
  ['city', ''], ['language', 'e.g. en (blank = en)'],
  ['tags', 'Several separated by ; e.g. csr; education'],
  ['source', 'How they came to us'], ['reference', 'Who referred them'],
  ['donor status', 'e.g. Individual, Corporate CSR'], ['owner', 'Ek Tara contact owner'], ['owner_email', ''],
  ['project', ''], ['core programme', ''],
  ['last donation date', 'e.g. 2026-11-18'], ['notes', '']
];
const DONOR_CSV = DONOR_CSV_COLS.map(c => c[0]).join(',') + '\n';
/** What each trigger code means, shown when you hover over it. None runs on its own any more: messages are broadcasts you write, or older records. */
const D_TRIGGERS = {
  T1: 'T1 Welcome (no longer automatic): a welcome to a new potential donor. Unsent messages left over from it are removed.',
  T2: 'T2 Thank-you (no longer automatic): a thank-you for a recorded donation. Unsent messages left over from it are removed.',
  T3: 'T3 Became a donor (no longer automatic): a first donation used to move a potential donor to D1 or D2.',
  T4: 'T4 Campaign update (removed): updates to a campaign\u2019s donors are no longer sent. Unsent messages left over from it are removed.',
  T5: 'T5 Campaign results (no longer automatic): a results update used to be drafted when a campaign was marked results ready.',
  T6: 'T6 Moved to P5 (no longer automatic): campaign donors who had not given again used to move to P5.',
  T7: 'T7 A year ago (no longer automatic): last year’s donors (P4) used to get an “a year ago you helped” update 11 months after their last donation. Send it as a broadcast instead. Unsent messages left over from it are removed.',
  T8: 'T8 General update: a broadcast you write for the segments you choose. Needs approval.',
  T11: 'T11 Special update: a one-off broadcast written by the team. Needs approval.',
  T12: 'T12 Festive greeting: a greeting for a festival, written by the team. Dropped if not sent within 2 days of the festival.'
};
const dTrig = code => { const c = String(code || '').toUpperCase(); return D_TRIGGERS[c] ? '<span class="d-trig" title="' + esc(D_TRIGGERS[c]) + '">' + esc(code) + '</span>' : esc(code || ''); };
/** Text such as "T3: first donation recorded" with every trigger code in it explained on hover. */
const dTrigIn = text => esc(text || '').replace(/\bT(1[0-2]|[1-9])\b/g, m => dTrig(m));
// ---------- tags (donor form and broadcast filter) ----------
const dTagChip = (t, btn) => '<span class="d-chip" data-t="' + esc(t) + '">' + esc(t) + (btn ? '<button type="button" data-rm-tag aria-label="Remove tag ' + esc(t) + '" title="Remove">×</button>' : '') + '</span>';
const dTagEditorHtml = tags => '<div style="grid-column:1/-1"><label for="f-tagin">Tags</label><div class="d-tags" id="f-tags">' + (tags || []).map(t => dTagChip(t, true)).join('') +
  '<input id="f-tagin" list="d-taglist" autocomplete="off" placeholder="Type a tag, press Enter"></div><datalist id="d-taglist"></datalist>' +
  '<p class="small muted" style="margin:4px 0 0">A donor can have several tags. Broadcasts can then go to only the donors of a segment with certain tags.</p></div>';
/** Tags in the editor, plus anything still typed in the box. */
function dTagValues(root) {
  const box = $('#f-tags', root); if (!box) return [];
  const out = [], seen = {}, typed = $('#f-tagin', root) ? $('#f-tagin', root).value : '';
  $$('.d-chip', box).map(c => c.dataset.t).concat(typed.split(/[;,]/)).forEach(t => { t = String(t).replace(/\s+/g, ' ').trim(); if (t && !seen[t.toLowerCase()]) { seen[t.toLowerCase()] = 1; out.push(t); } });
  return out;
}
function bindTagEditor(root) {
  const box = $('#f-tags', root), inp = $('#f-tagin', root); if (!box || !inp) return;
  const add = raw => String(raw).split(/[;,]/).forEach(t => {
    t = t.replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!t || $$('.d-chip', box).some(c => c.dataset.t.toLowerCase() === t.toLowerCase())) return;
    inp.insertAdjacentHTML('beforebegin', dTagChip(t, true));
  });
  inp.onkeydown = e => {
    if ((e.key === 'Enter' || e.key === ',' || e.key === ';') && inp.value.trim()) { e.preventDefault(); add(inp.value); inp.value = ''; }
    else if (e.key === 'Enter') e.preventDefault();
    else if (e.key === 'Backspace' && !inp.value) { const c = $$('.d-chip', box).pop(); if (c) c.remove(); }
  };
  inp.onchange = () => { if (inp.value.trim()) { add(inp.value); inp.value = ''; } };   // picked from the suggestions
  box.onclick = e => { const b = e.target.closest('[data-rm-tag]'); if (b) { b.closest('.d-chip').remove(); inp.focus(); } else if (e.target === box) inp.focus(); };
  call('donor.tags').then(t => { const dl = $('#d-taglist', root); if (dl) dl.innerHTML = t.all.map(x => '<option value="' + esc(x) + '">').join(''); }).catch(() => {});
}
const dToday = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
/** A status badge that copes with an empty status (donor screens). */
const dBadge = s => s === 'received' ? badge('delivered').replace(/>[^<]*<\/span>$/, '>Received</span>')   // a donor's reply (not a message we sent)
  : s ? badge(s) : '<span class="badge b-cancelled">Unknown</span>';
/** The "Message" line of a donor's reply: where it came from and what it answers. */
const dReplyLine = g => '↩ Reply on WhatsApp' + (g.broadcast_name ? ' to ' + esc(g.broadcast_name) : g.template_name ? ' to ' + esc(g.template_name) : '');
const dActive = d => String((d && d.contact_status) || 'ACTIVE').toUpperCase() !== 'INACTIVE';
const dChannel = g => g.channel !== 'email' ? 'WhatsApp' : g.message_type === 'report_reminder' ? 'Email to owner' : 'Email' + (g.to_email ? ' to ' + g.to_email : '');
const D_ICON_EDIT = svgi('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>');
const D_ICON_TRASH = svgi('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>');
// Icon buttons of the donor screens: the pencil (edit) is light green, the dustbin (delete) light red. Colours follow the light and dark themes.
document.head.insertAdjacentHTML('beforeend', '<style id="d-icon-btns">' +
  '.btn.d-edit{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card));border-color:color-mix(in srgb,var(--ok) 35%,var(--line-2))}' +
  '.btn.d-edit:hover{background:color-mix(in srgb,var(--ok) 22%,var(--card));border-color:var(--ok)}' +
  '.btn.d-del{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;vertical-align:middle;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 35%,var(--line-2))}' +
  '.btn.d-del:hover{background:color-mix(in srgb,var(--bad) 20%,var(--card));border-color:var(--bad)}.btn.d-del svg{width:16px;height:16px}.btn.d-edit{vertical-align:middle}</style>');
async function dmeta() { if (!state.dmeta) state.dmeta = await call('donor.meta'); return state.dmeta; }
const D_ICON_X = svgi('<path d="M6 6l12 12M18 6 6 18"/>');
/** A pop-up that closes only with its × (or its own Close / Cancel button): a click outside it or the Esc key no longer closes it, so typed details are not lost. */
function dCloseOnlyByX(m) {
  m.dataset.noesc = '1';   // the shared pop-up code then ignores outside clicks and Esc
  const p = m.querySelector('.modal'); if (!p) return m;
  p.style.position = 'relative';
  const h = p.querySelector('h2'); if (h) h.style.paddingRight = '44px';   // keep the title clear of the ×
  p.insertAdjacentHTML('afterbegin', '<button type="button" class="ibtn d-x" title="Close" aria-label="Close" style="position:absolute;top:12px;right:12px">' + D_ICON_X + '</button>');
  p.querySelector('.d-x').onclick = m.close;
  return m;
}

async function driveDonorSend(title) {
  const m = modal('<div class="busy-modal">' + stringSvg('md') + '<h2>' + (title || 'Sending\u2026') + '</h2><p id="p" class="muted" style="margin:0">Working\u2026</p><p class="small muted" style="margin:0">Only contacts who opted in to WhatsApp or email get messages.</p></div>');
  m.dataset.noesc = '1';
  let total = 0, mail = '';
  try {
    for (let i = 0; i < 30; i++) {
      const r = await call('donor.dispatch'); total += r.sent + (r.email_sent || 0);
      $('#p', m).textContent = total + ' sent' + (r.remaining ? ', ' + r.remaining + ' more\u2026' : '.');
      if (r.email_by === 'owner' && r.email_sent) mail = 'Emails went from ' + (r.owner || 'the organisation account') + '. ';
      if (r.email_waiting) mail += r.email_waiting + ' email' + (r.email_waiting === 1 ? '' : 's') + ' will go from ' + (r.owner || 'the organisation account') + ' with the next background run (within 5 minutes). ';
      if (!r.remaining) break;
    }
    await showDone(m, total ? total + ' sent' : (mail ? 'Emails are on their way' : 'Nothing to send right now'), mail + (total ? 'Check the Queue to see the status of each message.' : 'Messages held by the rules stay in the Queue with the reason.'));
  } finally { m.close(); }
  return total;
}

// ---------- overview ----------
views['donor/home'] = async function () {
  await dmeta();
  const d = await call('donor.home');
  if (!d.ready) {
    main().innerHTML = '<div class="head"><div><h1>Donor Communication</h1><p class="sub">One step before you can start.</p></div></div><div class="alert info"><b>' + esc(d.message) + '</b>' + (d.problem ? '<br>' + esc(d.problem) : '') + (d.build_problem ? '<br><b>Some files in the project are out of date:</b> ' + esc(d.build_problem) + '. Replace every file from the latest zip.' : '') + '</div>' +
      '<div class="card">' + (d.layout
        ? '<p style="margin-top:0">The app reads each column by its position, so nothing is read or saved until the columns are back in this order. Move whole columns (with their data) in the donor Google Sheet, then reload this page. Extra columns of your own may go to the right of these.</p>' +
          d.expected.map(t => '<details class="d-msgs"><summary>' + esc(t.tab) + ' <span class="muted small">(' + t.columns.length + ' columns)</span></summary><p class="small" style="margin:6px 0 0">' + t.columns.map((c, i) => '<b>' + (i + 1) + '</b> ' + esc(c)).join(' · ') + '</p></details>').join('')
      : d.can_setup ? '<p style="margin-top:0">You are the project owner, so you can do this now. It creates the donor Google Sheet and its tabs and moves any older donor data into it. It is safe to run again.</p><button class="btn primary" id="setupnow">Set up now</button>'
        : '<p style="margin:0">Only the project owner can do this. Ask them to open this screen and click <b>Set up now</b>, or to run <b>setup</b> in the Apps Script editor.</p>') + '</div>';
    const sb = $('#setupnow'); if (sb) sb.onclick = async () => { try { await call('admin.setup'); state.dmeta = null; toast('Setup finished'); views['donor/home'](); } catch (e) { toast(e.message, true); } };
    return;
  }
  const q = d.queue;
  main().innerHTML = '<div class="head"><div><h1>Donor Communication</h1><p class="sub" style="margin:0">' + d.total + ' contacts \u00b7 ' + d.opted_in + ' with WhatsApp opt-in</p></div>' +
    '<button class="btn primary" id="sendnow">Send waiting messages now</button></div>' +
    '<div class="card"><h2>Contacts by segment</h2><div class="tiles">' + Object.keys(state.dmeta.segments).map(c => '<div class="tile" style="cursor:pointer" data-seg="' + c + '"><b data-count="' + (d.segments[c] || 0) + '">' + (d.segments[c] || 0) + '</b>' + segTag(c) + ' ' + esc(state.dmeta.segments[c]) + '</div>').join('') + '</div></div>' +
    '<div class="card"><h2>Needs attention</h2>' +
    (d.drafts.length ? '<p><span class="badge b-held">' + d.drafts.length + ' to approve</span> ' + d.drafts.map(x => esc(x.name) + ' <span class="muted small">(' + dTrig(x.trigger) + (x.send_on ? ', send ' + esc(x.send_on) : '') + ')</span>').join('; ') + ' <a href="#" data-go="donor/broadcasts">Review</a></p>' : '') +
    (q.held ? '<p><span class="badge b-held">' + q.held + ' held</span> (no opt-in, or a missing template or value). <a href="#" data-go="donor/queue">See why</a></p>' : '') +
    (q.failed ? '<p><span class="badge b-failed">' + q.failed + ' failed</span> <a href="#" data-go="donor/queue">Retry</a></p>' : '') +
    (d.missing_templates.length ? '<p class="muted">No approved template yet for: ' + d.missing_templates.map(esc).join(', ') + '. <a href="#" data-go="donor/templates">Templates</a></p>' : '') +
    (!d.drafts.length && !q.held && !q.failed ? '<p class="muted">Nothing needs attention.</p>' : '') + '</div>' +
    '<p class="small muted">Sent in the last 7 days: ' + q.sent_7d + ' \u00b7 waiting: ' + q.queued + '</p>';
  $('#sendnow').onclick = async () => { const n = await driveDonorSend(); toast(n + ' messages sent'); views['donor/home'](); };
  $$('[data-seg]').forEach(t => t.onclick = () => { state.donorFilter = { segment: t.dataset.seg }; go('donor/donors'); });
  $$('[data-d]').forEach(t => t.onclick = () => donorModal(t.dataset.d));
};

// ---------- donors ----------
views['donor/donors'] = async function () {
  await dmeta();
  let size = 20; try { size = Number(localStorage.getItem('ektara-contacts-size')) || 20; } catch (e) { /* storage can be blocked */ }
  const f = Object.assign({ segment: '', q: '', optin: '', email_optin: '', active: 'yes', page: 1, size: [10, 20, 50, 100].indexOf(size) >= 0 ? size : 20 }, state.donorFilter || {}); state.donorFilter = null;
  let upload = window.__donorUpload || null; window.__donorUpload = null;
  const all = await call('donor.donors.list', {});
  const waBadge = d => !d.phone_e164 ? '<span class="badge b-cancelled">No phone</span>' : d.opted_out ? '<span class="badge b-cancelled">WhatsApp: replied STOP</span>' : d.whatsapp_opt_in ? '<span class="badge b-approved">WhatsApp opt-in</span>' : '<span class="badge b-held">No WhatsApp opt-in</span>';
  function draw() {
    const rows = all.filter(d => (!f.segment || d.segment === f.segment) && (!f.q || (d.name + ' ' + (d.phone_e164 || '') + ' ' + (d.city || '') + ' ' + (d.email || '') + ' ' + (d.org || '') + ' ' + (d.tags || []).join(' ')).toLowerCase().indexOf(f.q.toLowerCase()) >= 0) &&
      (!f.optin || (f.optin === 'yes' ? d.whatsapp_opt_in && !d.opted_out : !(d.whatsapp_opt_in && !d.opted_out))) &&
      (!f.email_optin || (f.email_optin === 'yes' ? !!d.email_opt_in : !d.email_opt_in)) &&
      (!f.active || dActive(d)));
    const pages = Math.max(1, Math.ceil(rows.length / f.size)); f.page = Math.min(Math.max(1, f.page), pages);
    const from = (f.page - 1) * f.size, shown = rows.slice(from, from + f.size);
    main().innerHTML = '<div class="head"><div><h1>Contacts</h1><p class="sub" style="margin:0">' + all.length + ' contacts. Segments change over time and every change is kept.</p></div>' +
      '<div class="row" style="flex:0 0 auto"><button class="btn" id="sample" title="Download an empty CSV with the right columns">Sample CSV</button><button class="btn" id="up">Upload CSV</button><input type="file" id="file" accept=".csv,text/csv" style="display:none"><button class="btn primary" id="add">Add contact</button></div></div>' +
      (upload ? '<div class="card"><b>' + upload.inserted + ' added, ' + upload.updated + ' updated, ' + upload.rejected + ' rejected.</b>' + (upload.errors.length ? '<div class="scroll"><table><thead><tr><th>Row</th><th>Phone</th><th>Reason</th></tr></thead><tbody>' + upload.errors.map(e => '<tr><td>' + e.row + '</td><td>' + esc(e.phone || '') + '</td><td>' + esc(e.reason) + '</td></tr>').join('') + '</tbody></table></div>' : '') + '</div>' : '') +
      '<div class="card"><div class="row">' + fld('Search', '<input id="q" value="' + esc(f.q) + '" placeholder="Name, org, phone, email, city, tag">') +
      fld('Segment', '<select id="fs"><option value="">All</option>' + Object.keys(state.dmeta.segments).map(c => opt(c, c + ' · ' + state.dmeta.segments[c], c === f.segment)).join('') + '</select>') +
      fld('Status', '<label class="d-switch"><input type="checkbox" id="fa" role="switch"' + (f.active ? ' checked' : '') + '><span class="d-track" aria-hidden="true"></span><span>Active only</span></label>') +
      fld('WhatsApp opt-in', '<label class="d-switch"><input type="checkbox" id="fo" role="switch"' + (f.optin === 'yes' ? ' checked' : '') + '><span class="d-track" aria-hidden="true"></span><span>Opted in only</span></label>') +
      fld('Email opt-in', '<label class="d-switch"><input type="checkbox" id="feo" role="switch"' + (f.email_optin === 'yes' ? ' checked' : '') + '><span class="d-track" aria-hidden="true"></span><span>Opted in only</span></label>') + dCount(rows.length, all.length, 'contact') + '</div></div>' +
      '<div class="card scroll">' + (rows.length ? '<table><thead><tr><th>Name</th><th>Segment</th><th>Phone</th><th>Email</th><th>City</th><th>Last communicated</th><th>Org</th><th>Reference</th><th><span class="d-sr">Edit</span></th></tr></thead><tbody>' + shown.map(d =>
        '<tr' + (dActive(d) ? '' : ' style="opacity:.6"') + '><td>' + esc(d.name) + (dActive(d) ? '' : ' <span class="badge b-cancelled">Inactive</span>') + '<div class="small muted">' + esc(d.contact_type || '') + '</div>' + ((d.tags || []).length ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">' + d.tags.map(t => '<span class="d-chip sm">' + esc(t) + '</span>').join('') + '</div>' : '') + '</td><td>' + segTag(d.segment) + '</td><td class="small">' + esc(d.phone_e164 || '') + '<div>' + waBadge(d) + '</div></td><td class="small">' + esc(d.email || '') + (d.email ? '<div>' + (d.email_opt_in ? '<span class="badge b-approved">Email opt-in</span>' : '<span class="badge b-held">No email opt-in</span>') + '</div>' : '') + '</td><td>' + esc(d.city || '') + '</td>' +
        '<td class="small muted">' + (d.last_message_at ? esc(label((d.last_message_type || '').replace(/_/g, ' ')) + ' · ' + timeAgo(d.last_message_at)) : '') + '</td>' +
        '<td>' + esc(d.org || '') + '</td><td class="small">' + esc(d.reference || '') + '</td>' +
        '<td class="d-act"><button class="btn small d-edit" data-edit="' + d.id + '" title="Edit" aria-label="Edit ' + esc(d.name) + '">' + D_ICON_EDIT + '</button></td></tr>').join('') + '</tbody></table>' +
        // footer: rows per page and page n / total
        '<div class="d-pager"><span class="small muted">Showing ' + (from + 1) + '–' + (from + shown.length) + ' of ' + rows.length + '</span>' +
        '<label class="d-pager-size">Rows per page <select id="psize">' + [10, 20, 50, 100].map(n => opt(n, n, n === f.size)).join('') + '</select></label>' +
        '<span class="d-pager-nav"><button class="btn small" id="pprev"' + (f.page <= 1 ? ' disabled' : '') + ' aria-label="Previous page">‹ Prev</button><span class="small"><b>' + f.page + '</b> / ' + pages + '</span><button class="btn small" id="pnext"' + (f.page >= pages ? ' disabled' : '') + ' aria-label="Next page">Next ›</button></span></div>'
        : (all.length ? '<div class="empty">No contacts match these filters.</div>' : emptyState('heart', 'No contacts yet', 'Add a contact or upload a CSV. Each row needs a name and a segment.', { label: 'Upload CSV', attr: 'data-click="#up"' }))) + '</div>';
    const redraw = () => { f.page = 1; draw(); };
    $('#q').oninput = e => { f.q = e.target.value; const p = e.target.selectionStart; redraw(); const q = $('#q'); q.focus(); q.setSelectionRange(p, p); };
    $('#fs').onchange = e => { f.segment = e.target.value; redraw(); };
    $('#fa').onchange = e => { f.active = e.target.checked ? 'yes' : ''; redraw(); $('#fa').focus(); };
    $('#fo').onchange = e => { f.optin = e.target.checked ? 'yes' : ''; redraw(); $('#fo').focus(); };
    $('#feo').onchange = e => { f.email_optin = e.target.checked ? 'yes' : ''; redraw(); $('#feo').focus(); };
    if ($('#psize')) $('#psize').onchange = e => { f.size = Number(e.target.value); try { localStorage.setItem('ektara-contacts-size', f.size); } catch (err) { /* ignore */ } redraw(); };
    if ($('#pprev')) $('#pprev').onclick = () => { f.page--; draw(); };
    if ($('#pnext')) $('#pnext').onclick = () => { f.page++; draw(); };
    $('#add').onclick = () => donorForm(null, { segment: f.segment });   // a new contact starts in the segment the list is filtered to
    $('#sample').onclick = () => {
      const href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + DONOR_CSV);   // the BOM makes Excel read it as UTF-8
      const m = modal('<h2>Contacts CSV template</h2><p class="small muted" style="margin-top:0">An empty file with the right column names. Add one row per contact, save it as CSV, then use <b>Upload CSV</b>. A contact already saved (same phone, or same email when there is no phone) is updated; anyone else is added. Blank cells leave existing values unchanged.</p>' +
        '<div class="scroll" style="max-height:320px;overflow-y:auto"><table><thead><tr><th>Column</th><th>What to put</th></tr></thead><tbody>' +
        DONOR_CSV_COLS.map(c => '<tr><td style="white-space:nowrap"><code>' + esc(c[0]) + '</code>' + (c[2] ? ' <span class="d-req" title="Required">*</span>' : '') + '</td><td class="small">' + esc(c[1] || '') + '</td></tr>').join('') + '</tbody></table></div>' +
        '<p class="small muted"><span class="d-req">*</span> required. Keep the header row as it is.</p>' +
        '<div class="actions"><button class="btn" id="x">Close</button><a class="btn primary" style="text-decoration:none;display:inline-block" download="contacts_template.csv" href="' + href + '">Download empty CSV</a></div>', true);
      $('#x', m).onclick = m.close;
    };
    $('#up').onclick = () => $('#file').click();
    $('#file').onchange = e => { const file = e.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = async () => { try { window.__donorUpload = await call('donor.donors.import', String(r.result)); toast('Upload finished'); go('donor/donors'); } catch (err) { toast(err.message, true); } }; r.readAsText(file, 'utf-8'); };

  broadcast: { api: 'donor.broadcasts', view: 'donor/broadcasts', word: 'broadcast', del: 'It is removed for good, with any of its messages that never went out. This can’t be undone.' },

    main().innerHTML = '<div class="head"><div><h1>Queue</h1><p class="sub" style="margin:0">Every donor message and why it is waiting. Each message goes by WhatsApp and/or email, as the donor opted in. Only contacts who opted in to that channel get it.</p></div><button class="btn primary" id="go">Send waiting messages now</button></div>' +
      (all.length ? '<div class="card"><div class="row">' + fld('Search', '<input id="qq" type="search" value="' + esc(f.q) + '" placeholder="Contact, campaign, broadcast or status (e.g. queued, held, sent, failed)">') + dCount(list.length, all.length, 'message') + '</div><p class="small muted" style="margin:6px 0 0">The newest 1000 messages.</p></div>' : '') +
      '<div class="card scroll">' + (list.length ? '<table><thead><tr><th>Contact</th><th>Message</th><th>Campaign</th><th>Broadcast</th><th>Status</th><th>Why / details</th><th>Updated</th><th></th></tr></thead><tbody>' + shown.map(m =>
        '<tr><td>' + segTag(m.donor_segment) + ' ' + esc(m.donor_name) + '</td><td class="small">' + esc(String(m.message_type || '').replace(/_/g, ' ')) + '<div class="muted">' + (m.status === 'received' ? dReplyLine(m) : dTrig(m.trigger) + ' · ' + esc(dChannel(m))) + '</div></td><td class="small">' + orDash(m.campaign_name) + '</td><td class="small">' + orDash(m.broadcast_name) + '</td><td>' + dBadge(m.status) + '</td>' +
        '<td class="small muted">' + esc(m.hold_reason || m.wa_error || (m.status === 'queued' && m.not_before && Date.parse(m.not_before) > Date.now() ? 'Scheduled for ' + fmtDate(m.not_before) : '')) + (m.reply_text ? '<br>“' + esc(m.reply_text) + '”' : '') + '</td><td class="small muted">' + esc(timeAgo(m.updated_at)) + '</td>' +
        '<td style="white-space:nowrap">' + (['queued', 'held', 'awaiting_confirmation'].indexOf(m.status) >= 0 ? '<button class="btn small" data-c="' + m.id + '">Cancel</button>' : m.status === 'failed' ? '<button class="btn small" data-rt="' + m.id + '">Retry</button>' : '') + '</td></tr>').join('') + '</tbody></table>' +
        // footer: rows per page and page n / total (same as the Contacts page)
        '<div class="d-pager"><span class="small muted">Showing ' + (from + 1) + '–' + (from + shown.length) + ' of ' + list.length + '</span>' +
        '<label class="d-pager-size">Rows per page <select id="psize">' + [10, 20, 50, 100].map(n => opt(n, n, n === f.size)).join('') + '</select></label>' +
        '<span class="d-pager-nav"><button class="btn small" id="pprev"' + (f.page <= 1 ? ' disabled' : '') + ' aria-label="Previous page">‹ Prev</button><span class="small"><b>' + f.page + '</b> / ' + pages + '</span><button class="btn small" id="pnext"' + (f.page >= pages ? ' disabled' : '') + ' aria-label="Next page">Next ›</button></span></div>'
        : all.length ? '<div class="empty">No messages match \u201c' + esc(f.q) + '\u201d.</div>' : emptyState('list', 'Nothing here', 'Messages appear in the queue as soon as a broadcast is approved.', null)) + '</div>';
    const qq = $('#qq'); if (qq) qq.oninput = e => { f.q = e.target.value; f.page = 1; const pos = e.target.selectionStart; draw(); const n = $('#qq'); n.focus(); n.setSelectionRange(pos, pos); };
    if ($('#psize')) $('#psize').onchange = e => { f.size = Number(e.target.value); f.page = 1; try { localStorage.setItem('ektara-queue-size', f.size); } catch (err) { /* ignore */ } draw(); };
    if ($('#pprev')) $('#pprev').onclick = () => { f.page--; draw(); };
    if ($('#pnext')) $('#pnext').onclick = () => { f.page++; draw(); };
    $('#go').onclick = async () => { const n = await driveDonorSend(); toast(n + ' sent'); views['donor/queue'](); };
    $$('[data-c]').forEach(b => b.onclick = async () => { try { await call('donor.messages.cancel', b.dataset.c); views['donor/queue'](); } catch (e) { toast(e.message, true); } });
    $$('[data-rt]').forEach(b => b.onclick = async () => { try { await call('donor.messages.retry', b.dataset.rt); await driveDonorSend('Retrying…'); views['donor/queue'](); } catch (e) { toast(e.message, true); } });
  }
  draw();
};


</script>
