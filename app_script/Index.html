<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ek Tara Communications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
  // If anything stops the app from starting, say so on screen instead of leaving a blank page.
  (function () {
    var shown = false;
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function show(msg) {
      if (shown) return; shown = true;
      var d = document.createElement('div'); d.id = 'bootfail'; d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#7f1d1d;color:#fff;padding:14px 16px;border-radius:10px;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)';
      d.innerHTML = '<b>The app hit a problem while starting.</b><br>' + esc(msg) + '<br><span style="opacity:.85">Try Ctrl+Shift+R. If it continues, add <b>?diag=1</b> to the end of this page\u2019s address, open it, and send what it shows to the project owner.</span>';
      (document.body || document.documentElement).appendChild(d);
    }
    window.__bootFail = show;
    window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '')); });
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason); });
  })();
</script>
<script>
  (function () {
    var m = 'auto'; try { m = localStorage.getItem('ektara-theme') || 'auto'; } catch (e) {}
    var dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.dataset.mode = m;
  })();
</script>
<style>
:root {
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Tamil", sans-serif;
  --font-body: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Tamil", sans-serif;
  --bg:#eef1ee; --bg-2:#e2e8e4; --card:#ffffff; --text:#12201d; --text-2:#3b4a46; --muted:#5b6a65; --line:#d8dfdb; --line-2:#c3cdc8;
  --brand:#0e5e55; --ok:#0f7a4d; --warn:#9a5b00; --bad:#b42318; --info:#1b5fa8; --violet:#5b4fc7;
  --parent:#0e5e55; --donor:#9b2f5e; --overview:#7a5a06;
  --acc:var(--brand); --acc-ink:#ffffff;
  --r-s:7px; --r-m:12px; --r-l:18px;
  --sh-1:0 1px 2px rgba(18,32,29,.05);
  --sh-2:0 18px 44px -14px rgba(18,32,29,.32), 0 3px 10px rgba(18,32,29,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg:#0c1412; --bg-2:#16211e; --card:#131c19; --text:#e8f0ed; --text-2:#c3d0cb; --muted:#93a39d; --line:#25332f; --line-2:#34453f;
  --brand:#52c1b0; --ok:#4cc38a; --warn:#e3a93f; --bad:#f28b82; --info:#6db0f0; --violet:#a79bff;
  --parent:#52c1b0; --donor:#f08db5; --overview:#e2b84d; --acc-ink:#07130f;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 22px 52px -14px rgba(0,0,0,.75), 0 3px 10px rgba(0,0,0,.45);
  color-scheme: dark;
}
html[data-div="parent"] { --acc:var(--parent); }
html[data-div="donor"] { --acc:var(--donor); }
html[data-div="overview"] { --acc:var(--overview); }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; font:15px/1.5 var(--font-body); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body.noscroll { overflow:hidden; }
h1, h2, h3 { font-family:var(--font-display); font-weight:650; letter-spacing:-.015em; margin:0; text-wrap:balance; }
h1 { font-size:30px; line-height:1.15; letter-spacing:-.025em; margin-bottom:4px; }
h2 { font-size:17px; margin-bottom:10px; } h3 { font-size:16px; }
p { text-wrap:pretty; }
a { color:var(--acc); text-underline-offset:3px; }
::selection { background:color-mix(in srgb, var(--acc) 28%, transparent); }
:focus-visible { outline:3px solid color-mix(in srgb, var(--acc) 60%, transparent); outline-offset:2px; border-radius:4px; }
.sub { color:var(--muted); margin:0 0 18px; } .muted { color:var(--muted); } .small { font-size:12.5px; }
ul { padding-left:20px; }
pre { background:var(--bg); border:1px solid var(--line); padding:12px; border-radius:var(--r-s); overflow:auto; font-size:12.5px; }

.skip { position:fixed; left:12px; top:-60px; z-index:100; background:var(--acc); color:var(--acc-ink); padding:9px 14px; border-radius:var(--r-s); text-decoration:none; font-weight:600; transition:top .15s; }
.skip:focus { top:12px; }

/* ---- network activity line ---- */
#topbar { position:fixed; top:0; left:0; right:0; height:3px; z-index:90; pointer-events:none; opacity:0; transition:opacity .25s ease; overflow:hidden; }
#topbar.on { opacity:1; transition-delay:.12s; }
#topbar i { display:block; height:100%; width:38%; background:var(--acc); border-radius:0 3px 3px 0; animation:slide 1.1s var(--ease) infinite; }
@keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(280%); } }

/* ---- the string: Ek Tara's signature loader ---- */
.string { display:block; fill:none; stroke:var(--acc,var(--brand)); stroke-width:2.6; stroke-linecap:round; overflow:visible; }
.string circle { fill:var(--acc,var(--brand)); stroke:none; }
.string.sm { width:58px; height:20px; } .string.md { width:110px; height:36px; } .string.lg { width:190px; height:63px; }
#splash { position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:var(--bg); transition:opacity .38s ease, visibility .38s; }
#splash.out { opacity:0; visibility:hidden; }
.sp-in { text-align:center; display:grid; justify-items:center; gap:10px; }
.sp-word { font-family:var(--font-display); font-weight:700; font-size:30px; letter-spacing:-.02em; margin-top:6px; }
.sp-sub { color:var(--muted); font-size:14px; }

/* ---- skeletons ---- */
.sk { background:linear-gradient(90deg, var(--bg-2) 25%, color-mix(in srgb, var(--bg-2) 55%, var(--card)) 38%, var(--bg-2) 63%); background-size:400% 100%; animation:shimmer 1.5s ease-in-out infinite; border-radius:6px; }
@keyframes shimmer { from { background-position:100% 50%; } to { background-position:0 50%; } }
.sk-top { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; margin-bottom:18px; }
.sk-h1 { height:30px; width:min(320px,60%); margin-bottom:10px; } .sk-sub { height:14px; width:min(460px,80%); margin-bottom:22px; }
.sk-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); } .sk-row:last-child { border:0; } .sk-row .sk { height:14px; }
.sk-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; } .sk-tile { height:84px; border-radius:var(--r-m); }
.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---- header ---- */
header { position:sticky; top:0; z-index:30; }
header::before { content:""; position:absolute; inset:0; z-index:-1; background:color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter:saturate(1.5) blur(14px); -webkit-backdrop-filter:saturate(1.5) blur(14px); border-bottom:1px solid var(--line); }
.bar { max-width:1160px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:12px; }
.logo { display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.02em; color:var(--text); }
.mark { width:30px; height:30px; flex:none; }
.mark-img { height:34px; width:auto; max-width:170px; object-fit:contain; flex:none; display:block; border-radius:0; }   /* never rounded: a rectangular logo must keep its corners */
.foot-brand .mark-img { height:28px; } .sp-logo { max-width:240px; max-height:100px; object-fit:contain; border-radius:0; }
html[data-theme="dark"] .mark-img, html[data-theme="dark"] .sp-logo { background:#fff; box-shadow:0 0 0 5px #fff; margin:5px; }   /* a light plate behind the logo, drawn outside it so nothing is clipped */
html[data-logo="wide"] .logo > span, html[data-logo="wide"] .sp-word { display:none; }                          /* the logo already carries the name */
.divbadge { font-size:12.5px; font-weight:650; padding:4px 11px; border-radius:99px; color:var(--acc); background:color-mix(in srgb, var(--acc) 13%, transparent); white-space:nowrap; }
nav.tabs { display:flex; gap:2px; margin-left:4px; }
nav.tabs a { display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px; color:var(--muted); font-weight:560; cursor:pointer; text-decoration:none; transition:background .15s, color .15s; white-space:nowrap; }
nav.tabs a:hover { color:var(--text); background:var(--bg-2); }
nav.tabs a.on { color:var(--acc); background:color-mix(in srgb, var(--acc) 12%, transparent); }
nav.tabs a[aria-current="page"] { color:var(--acc); }
.ni { display:none; } .ni svg { width:22px; height:22px; }
.tools { margin-left:auto; display:flex; align-items:center; gap:6px; }
.ibtn { width:36px; height:36px; display:grid; place-items:center; border:0; background:transparent; color:var(--text-2); border-radius:50%; cursor:pointer; transition:background .15s; }
.ibtn:hover { background:var(--bg-2); } .ibtn svg { width:19px; height:19px; }
.kbtn { display:flex; align-items:center; gap:8px; height:36px; padding:0 8px 0 12px; border:1px solid var(--line-2); background:var(--card); color:var(--muted); border-radius:99px; cursor:pointer; font:inherit; font-size:13.5px; }
.kbtn:hover { border-color:var(--acc); color:var(--text); } .kbtn svg { width:17px; height:17px; }
.kbtn span, .kbtn kbd, .me-email { display:none; } .kbtn { padding:0; width:36px; justify-content:center; }
kbd { font:600 11.5px/1 var(--font-body); padding:3px 6px; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:5px; background:var(--bg); color:var(--text-2); }
.me { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; max-width:220px; }
.avatar { width:30px; height:30px; border-radius:50%; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
.me-email { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#switch { display:inline-flex; align-items:center; gap:6px; } #switch svg { width:15px; height:15px; }

main { width:100%; max-width:1160px; margin:0 auto; padding:28px 20px 48px; flex:1; outline:none; }
main:focus, main:focus-visible, .modal:focus, .modal:focus-visible { outline:none; }
main.enter { animation:viewin .24s var(--ease); }
@keyframes viewin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.head .sub { margin:0; max-width:64ch; }

/* ---- surfaces ---- */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:18px; margin-bottom:16px; }
.alert { padding:11px 14px; border-radius:var(--r-s); margin-bottom:14px; background:color-mix(in srgb, var(--bad) 9%, var(--card)); border:1px solid color-mix(in srgb, var(--bad) 28%, var(--line)); border-left:4px solid var(--bad); color:var(--text); }
.alert.ok { background:color-mix(in srgb, var(--ok) 9%, var(--card)); border-color:color-mix(in srgb, var(--ok) 28%, var(--line)); border-left-color:var(--ok); }
.alert.info { background:color-mix(in srgb, var(--info) 9%, var(--card)); border-color:color-mix(in srgb, var(--info) 28%, var(--line)); border-left-color:var(--info); }
.alert ul { margin:4px 0 0 18px; padding:0; }

/* ---- controls ---- */
.btn { position:relative; font:inherit; font-weight:580; border:1px solid var(--line-2); background:var(--card); color:var(--text); padding:8px 15px; border-radius:var(--r-s); cursor:pointer; transition:background .15s, border-color .15s, transform .08s; }
.btn:hover { background:var(--bg); border-color:var(--muted); } .btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.5; cursor:default; transform:none; }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
.btn.primary:hover { background:color-mix(in srgb, var(--acc) 86%, #000); border-color:color-mix(in srgb, var(--acc) 86%, #000); }
.btn.danger { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, var(--line-2)); } .btn.danger:hover { background:color-mix(in srgb, var(--bad) 8%, var(--card)); }
.btn.small { padding:4px 10px; font-size:12.5px; }
.btn.is-busy { color:transparent !important; pointer-events:none; }
.btn.is-busy::after { content:""; position:absolute; inset:0; margin:auto; width:16px; height:16px; border-radius:50%; border:2px solid var(--text); border-right-color:transparent; animation:spin .7s linear infinite; }
.btn.primary.is-busy::after { border-color:var(--acc-ink); border-right-color:transparent; }
@keyframes spin { to { transform:rotate(360deg); } }
input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-s); padding:9px 11px; width:100%; transition:border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--muted) 75%, transparent); }
textarea { min-height:96px; resize:vertical; }
label { display:block; font-size:12.5px; font-weight:560; color:var(--text-2); margin:12px 0 5px; }
label.inline { display:flex; align-items:center; gap:8px; color:var(--text); font-size:14.5px; font-weight:450; margin:12px 0; } label.inline input { width:auto; accent-color:var(--acc); }
input[type="checkbox"] { accent-color:var(--acc); }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; } .row > * { flex:1 1 160px; } .row > .btn { flex:0 0 auto; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } @media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
.checks { display:flex; flex-wrap:wrap; gap:6px 16px; margin:6px 0; } .checks label { display:flex; align-items:center; gap:7px; margin:0; font-size:14px; font-weight:450; color:var(--text); } .checks input { width:auto; }

/* ---- data ---- */
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 12px; font-size:12.5px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line-2); white-space:nowrap; }
td { text-align:left; padding:12px; border-bottom:1px solid var(--line); vertical-align:top; }
tbody tr:last-child td { border-bottom:0; }
tr.click { cursor:pointer; } tr.click:hover td { background:color-mix(in srgb, var(--acc) 6%, var(--card)); }
tr.click:focus-visible { outline:2px solid var(--acc); outline-offset:-2px; }
.badge { --bc:var(--muted); display:inline-flex; gap:6px; align-items:center; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; background:color-mix(in srgb, var(--bc) 13%, transparent); color:var(--bc); }
.badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.b-sent,.b-delivered,.b-sending { --bc:var(--info); } .b-read { --bc:var(--violet); } .b-confirmed,.b-approved { --bc:var(--ok); }
.b-declined,.b-pending_meta,.b-held,.b-awaiting_confirmation { --bc:var(--warn); } .b-flagged,.b-rejected,.b-failed { --bc:var(--bad); } .b-cancelled,.b-skipped { --bc:var(--muted); }
.bar2 { display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--bg-2); }
.bar2 span { display:block; transition:width .5s var(--ease); }
.c-confirmed { background:var(--ok); } .c-declined { background:var(--warn); } .c-awaiting { background:var(--info); } .c-flagged { background:var(--bad); } .c-failed { background:var(--muted); } .c-cancelled { background:var(--line-2); }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.chip { border:1px solid var(--line-2); background:var(--card); border-radius:99px; padding:5px 13px; cursor:pointer; font-size:13.5px; font-weight:520; transition:background .15s, border-color .15s; user-select:none; }
.chip:hover { border-color:var(--acc); } .chip.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
.tl { list-style:none; margin:0; padding:0; } .tl li { padding:7px 0; border-bottom:1px dashed var(--line-2); font-size:13.5px; } .tl li:last-child { border:0; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.tile { background:var(--bg); border:1px solid var(--line); border-radius:var(--r-m); padding:14px; transition:border-color .15s, transform .15s; }
.tile[data-seg]:hover { border-color:var(--acc); transform:translateY(-2px); }
.tile b { display:block; font-family:var(--font-display); font-size:30px; line-height:1.1; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.seg { display:inline-block; min-width:30px; text-align:center; font-size:12px; font-weight:700; padding:2px 7px; border-radius:6px; background:color-mix(in srgb, var(--donor) 14%, transparent); color:var(--donor); }
.seg.p { background:color-mix(in srgb, var(--violet) 14%, transparent); color:var(--violet); }
.tag { display:inline-block; font-size:11px; font-weight:650; padding:2px 8px; border-radius:99px; background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--acc); margin-left:6px; vertical-align:middle; }
.pill { display:inline-block; font-size:13px; font-weight:560; padding:5px 13px; border-radius:99px; background:color-mix(in srgb, var(--acc) 13%, transparent); color:var(--acc); margin-top:10px; }
.wa { background:#dcf8c6; color:#111; border-radius:4px 14px 14px 14px; padding:10px 13px; white-space:pre-wrap; max-width:390px; box-shadow:0 1px 1px rgba(0,0,0,.18); }
.wa .btns { display:flex; gap:6px; margin-top:9px; } .wa .btns span { flex:1; background:#fff; text-align:center; color:#0a7ea4; padding:7px; border-radius:8px; font-weight:560; }
.live { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:12.5px; } .live i { width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.7); } }

/* ---- empty states ---- */
.empty, .empty-state { text-align:center; padding:44px 16px; color:var(--muted); }
.empty-state { display:grid; justify-items:center; gap:8px; }
.empty-state h3 { color:var(--text); font-size:18px; } .empty-state p { margin:0 0 8px; max-width:46ch; }
.es-ico { width:58px; height:58px; border-radius:18px; display:grid; place-items:center; color:var(--acc); background:color-mix(in srgb, var(--acc) 12%, transparent); } .es-ico svg { width:28px; height:28px; }

/* ---- modal, toasts ---- */
.overlay { position:fixed; inset:0; z-index:50; display:flex; justify-content:center; align-items:flex-start; padding:7vh 14px; overflow:auto; background:color-mix(in srgb, #040b09 56%, transparent); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); animation:fade .18s ease; }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
.modal { background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:24px; width:100%; max-width:640px; box-shadow:var(--sh-2); animation:sheet .24s var(--ease); outline:none; }
.modal.wide { max-width:860px; }
@keyframes sheet { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }
@keyframes sheetup { from { transform:translateY(40px); opacity:.6; } to { transform:none; opacity:1; } }
.modal h2 { font-size:19px; } .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
.busy-modal { display:grid; justify-items:center; gap:6px; text-align:center; padding:6px 0 2px; }
.meter { width:100%; max-width:260px; height:5px; border-radius:99px; background:var(--bg-2); overflow:hidden; margin:8px 0; } .meter i { display:block; height:100%; width:0; background:var(--acc); border-radius:99px; transition:width .35s var(--ease); }
.done { display:grid; justify-items:center; gap:10px; padding:14px 0; text-align:center; }
.okmark { width:64px; height:64px; fill:none; stroke:var(--ok); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.okmark circle { stroke-dasharray:145; stroke-dashoffset:145; animation:draw .5s var(--ease) forwards; opacity:.9; } .okmark path { stroke-dasharray:40; stroke-dashoffset:40; animation:draw .35s .38s var(--ease) forwards; }

  el.classList.toggle('off', !ok); el.textContent = ok ? 'Connected' : 'Connection problem';
}
window.addEventListener('offline', () => { if ($('#offline')) return; const b = document.createElement('div'); b.id = 'offline'; b.setAttribute('role', 'alert'); b.textContent = 'You are offline. Changes cannot be saved until you reconnect.'; document.body.appendChild(b); setOnline(false); });

// ---------- toasts ----------
function toast(msg, isErr) {
  const box = $('#toasts'); while (box.children.length >= 4) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.setAttribute('role', isErr ? 'alert' : 'status');
  t.innerHTML = '<span class="ti">' + (isErr ? ICON.alert : ICON.check) + '</span><span class="tm"></span><i class="tp"></i>';
  t.querySelector('.tm').textContent = msg;
  const life = isErr ? 7000 : 3800; t.style.setProperty('--life', life + 'ms');
  box.appendChild(t);
  let timer = setTimeout(rm, life);
  function rm() { t.classList.add('out'); setTimeout(() => t.remove(), 200); }
  t.onmouseenter = () => { clearTimeout(timer); t.classList.add('hold'); };
  t.onmouseleave = () => { t.classList.remove('hold'); timer = setTimeout(rm, 1800); };
  t.onclick = rm;
}

// ---------- modals: focus trap, Esc, restores focus, bottom sheet on phones ----------
function autoLabel(root) {
  $$('label', root).forEach(l => { if (l.htmlFor) return; const c = l.parentElement && l.parentElement.querySelector('input,select,textarea'); if (c && c.id) l.htmlFor = c.id; });
}
function modal(html, wide) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true" tabindex="-1">' + html + '</div>';
  const panel = o.firstChild, prev = document.activeElement;
  o.addEventListener('mousedown', e => { if (e.target === o && !o.dataset.noesc) o.close(); });
  document.body.appendChild(o); document.body.classList.add('noscroll');
  const h = panel.querySelector('h1,h2'); if (h) { if (!h.id) h.id = 'mh' + Date.now() % 1e6; panel.setAttribute('aria-labelledby', h.id); }
  autoLabel(panel);
  o.close = () => {
    if (!o.isConnected) return; o.remove();
    if (!$('.overlay')) document.body.classList.remove('noscroll');
    if (prev && prev.isConnected && prev !== document.body) { try { prev.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  };
  const first = panel.querySelector('input:not([type=hidden]),select,textarea'); (first || panel).focus({ preventScroll: true });
  return o;
}
document.addEventListener('keydown', e => {
  const top = Array.from(document.querySelectorAll('.overlay')).pop(); if (!top) return;
  if (e.key === 'Escape' && !top.dataset.noesc && top.close) { e.preventDefault(); top.close(); return; }
  if (e.key !== 'Tab') return;
  const f = Array.from(top.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')).filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); }
});

// ---------- empty states, count-up, success mark ----------
function emptyState(icon, title, text, btn) {
  return '<div class="empty-state"><div class="es-ico">' + ICON[icon] + '</div><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (btn ? '<button class="btn primary" ' + btn.attr + '>' + esc(btn.label) + '</button>' : '') + '</div>';
}
const fmtNum = n => Number(n).toLocaleString('en-IN');
function countUp(root) {
  $$('[data-count]', root).forEach(el => {
    const to = Number(el.dataset.count) || 0;
    if (reduce() || to < 3) { el.textContent = fmtNum(to); return; }
    const t0 = performance.now();
    (function step(t) { const p = Math.min(1, (t - t0) / 700); el.textContent = fmtNum(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); })(t0);
  });
}
const CHECKMARK = '<svg class="okmark" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 14-17"/></svg>';
async function showDone(m, text, sub) {
  const p = m.querySelector('.modal'); if (!p) return;
  p.innerHTML = '<div class="done" role="status">' + CHECKMARK + '<h2>' + esc(text) + '</h2>' + (sub ? '<p class="muted" style="margin:0">' + esc(sub) + '</p>' : '') + '</div>';
  await new Promise(r => setTimeout(r, reduce() ? 500 : 1100));
}

const fmtDate = iso => iso ? new Date(iso).toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' }) : '';
function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60); if (h < 24) return h + ' h ago';
  const d = Math.floor(h / 24); return d < 7 ? d + ' d ago' : fmtDate(iso);
}
function callTime(iso) {
  const w = new Date(iso), t = w.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }), n = new Date(), tm = new Date(n); tm.setDate(n.getDate() + 1);
  if (w.toDateString() === n.toDateString()) return 'around ' + t + ' today';
  if (w.toDateString() === tm.toDateString()) return 'around ' + t + ' tomorrow';
  return 'around ' + t + ', ' + w.toLocaleDateString(undefined, { day:'numeric', month:'short' });
}
const money = (n, cur) => { try { return new Intl.NumberFormat(undefined, { style:'currency', currency:cur, maximumFractionDigits:0 }).format(n); } catch (e) { return Math.round(n) + ' ' + cur; } };
const LABELS = { pending_meta:'Pending Meta', flagged:'Needs follow-up', awaiting_confirmation:'Awaiting trustee', held:'Held', skipped:'Skipped' };
const label = s => LABELS[s] || (s.charAt(0).toUpperCase() + s.slice(1));
const badge = s => '<span class="badge b-' + esc(s) + '">' + esc(label(s)) + '</span>';
const placeholders = body => Array.from(new Set((String(body).match(/\{\{(\d+)\}\}/g) || []).map(x => parseInt(x.slice(2), 10)))).sort((a, b) => a - b);
const GROUPS = [
  { key:'confirmed', label:'Confirmed', statuses:['confirmed'] }, { key:'declined', label:'Declined', statuses:['declined'] },
  { key:'awaiting', label:'Awaiting reply', statuses:['queued','sent','delivered','read'] },
  { key:'flagged', label:'Needs follow-up', statuses:['flagged'] }, { key:'failed', label:'Failed', statuses:['failed'] },
  { key:'cancelled', label:'Cancelled', statuses:['cancelled'] }
];
const gcount = (counts, st) => st.reduce((s, k) => s + (counts[k] || 0), 0);
function progressBar(counts) {
  const total = counts.total || 0;
  if (!total) return '<div class="bar2"></div>';
  return '<div class="bar2">' + GROUPS.map(g => { const n = gcount(counts, g.statuses); return n ? '<span class="c-' + g.key + '" style="width:' + (n / total * 100) + '%" title="' + g.label + ': ' + n + '"></span>' : ''; }).join('') + '</div>';
}
function errorsHtml(e) {

}
const main = () => $('#main');

// Choice helpers for institution -> class/year -> section
function tally(items, keyFn, countFn) {
  const m = new Map(); items.forEach(i => { const k = keyFn(i); if (k) m.set(k, (m.get(k) || 0) + countFn(i)); });
  return Array.from(m, ([value, count]) => ({ value, count })).sort((a, b) => natural(a.value, b.value));
}
const opt = (v, text, sel) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(text) + '</option>';

// ---------- router ----------
const state = { info: null, notices: [] };
const views = {};
const TILE_VIEWS = ['donor/home', 'overview/home'];
async function go(view, arg) {
  clearInterval(state.refresh); clearTimeout(state.timer); state.view = view;   // opening a screen cancels the welcome screen's automatic redirect
  $$('#nav a, #dnav a').forEach(a => { const on = a.dataset.go === view || a.dataset.go === view.split('/')[0]; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  loading(TILE_VIEWS.indexOf(view) >= 0 ? 'tiles' : 'table'); window.scrollTo({ top: 0, behavior: 'auto' });
  try { await views[view](arg); }
  catch (e) { if (e.status === 403 || e.status === 401) return; main().innerHTML = '<div class="alert">' + esc(e.message) + '</div>'; }
  finally { settleView(); }
}
// After a view renders: quiet fade-in, keyboard access for clickable rows, labels, focus for screen readers.
function settleView() {
  const m = main(); m.removeAttribute('aria-busy');
  $$('tr.click, .chip, .tile[data-seg]', m).forEach(x => { if (!x.hasAttribute('tabindex')) { x.tabIndex = 0; x.setAttribute('role', x.tagName === 'TR' ? 'button' : 'button'); } });
  autoLabel(m); countUp(m);
  m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter');
  if (!document.activeElement || document.activeElement === document.body || !m.contains(document.activeElement)) { try { m.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
document.addEventListener('keydown', e => {

});

// Time picker value "14:05" <-> message text "2:05 PM".
function to12h(v) {
  const m = /^(\d{2}):(\d{2})/.exec(v || '');
  if (!m) return '';
  const h = Number(m[1]);
  return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
}
function to24h(v) {
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(v || '');
  if (!m) return '';
  const h = Number(m[1]) % 12 + (m[3].toUpperCase() === 'PM' ? 12 : 0);
  return ('0' + h).slice(-2) + ':' + m[2];
}

// Apps Script has no background jobs: the page keeps asking the server to send the next batch.
async function driveSend(id, total) {
  const m = modal('<div class="busy-modal">' + stringSvg('md') + '<h2>Sending\u2026</h2><p id="p" class="muted" style="margin:0">Starting\u2026</p><div class="meter"><i id="mt"></i></div><p class="small muted" style="margin:0">Keep this tab open. If you close it, the background job finishes the rest within about 10\u201320 minutes.</p></div>');
  m.dataset.noesc = '1';
  try {
    for (;;) {
      const r = await call('campaigns.sendBatch', id);
      $('#p', m).textContent = r.remaining ? r.remaining + (total ? ' of ' + total : '') + ' still to send\u2026' : 'Done.';
      if (total) $('#mt', m).style.width = Math.round((total - r.remaining) / total * 100) + '%';
      if (!r.remaining || r.status === 'cancelled') break;
    }
    await showDone(m, total ? 'Sent to ' + total + ' parents' : 'Sent', 'Delivery and replies will appear on the campaign page.');
  } finally { m.close(); }
}

async function campaignDetail(id, statusFilter) {
  const c = await call('campaigns.get', id, statusFilter || null);
  const active = statusFilter ? GROUPS.find(g => g.statuses.indexOf(statusFilter) >= 0) : null;
  let group = (window.__grp && window.__grp.id === id) ? window.__grp.key : '';
  let msgs = c.messages;
  if (group) { const g = GROUPS.find(x => x.key === group); msgs = msgs.filter(m => g.statuses.indexOf(m.status) >= 0); }
  window.__grp = { id, key: group };
  const live = c.status === 'sending' || (c.counts.queued + c.counts.sent + c.counts.delivered + c.counts.read) > 0;
  main().innerHTML = noticesHtml() +
    '<p><a href="#" data-go="campaigns">\u2190 Campaigns</a></p>' +

    '<div class="row" style="flex:0 0 auto">' +
    (c.status === 'sending' || c.status === 'failed' ? '<button class="btn primary" id="cont">Continue sending</button>' : '') +
    (c.counts.failed ? '<button class="btn" id="retry">Retry failed (' + c.counts.failed + ')</button>' : '') +
    (c.status !== 'cancelled' ? '<button class="btn danger" id="stop">Stop campaign</button>' : '') +
    '<button class="btn" id="export">' + (c.archive_url ? 'Update Drive export' : 'Export to Drive') + '</button>' +
    (live ? '<span class="live"><i></i>Updating every 30 s</span>' : '') + '<button class="btn" id="refresh">Refresh</button></div></div>' +
    (c.archive_url ? '<div class="alert ok">Archived to Google Drive on ' + esc(fmtDate(c.archived_at)) + ': <a href="' + esc(c.archive_url) + '" target="_blank" rel="noopener">open the sheet</a></div>' : '') +
    '<div class="card">' + progressBar(c.counts) + '<div class="chips"><span class="chip ' + (group ? '' : 'on') + '" data-g="">All (' + c.counts.total + ')</span>' +
    GROUPS.map(g => { const n = gcount(c.counts, g.statuses); return n ? '<span class="chip ' + (group === g.key ? 'on' : '') + '" data-g="' + g.key + '">' + g.label + ' (' + n + ')</span>' : ''; }).join('') + '</div>' +
    '<div class="wa" style="margin-top:6px">' + esc(templateText(c)) + (c.template_has_buttons ? '<div class="btns"><span>Confirm</span><span>Can\u2019t attend</span></div>' : '') + '</div></div>' +
    '<div class="card scroll">' + (msgs.length ? '<table><thead><tr><th>Parent</th><th>Student</th><th>Phone</th><th>Status</th><th>Details</th></tr></thead><tbody>' +
      msgs.map(m => '<tr class="click" data-m="' + m.id + '"><td>' + esc(m.parents.parent_name) + '</td><td>' + esc(m.parents.child_name || '') + '</td><td>' + esc(m.parents.phone_e164) + '</td><td>' + badge(m.status) + '</td><td class="small muted">' + esc(messageDetails(m)) + (m.reply_text ? '<br>\u201c' + esc(m.reply_text) + '\u201d' : '') + '</td></tr>').join('') +
      '</tbody></table>' : '<div class="empty">No parents in this view.</div>') + '</div>';

  const reload = () => { loading(); return campaignDetail(id); };
  $$('[data-g]').forEach(ch => ch.onclick = () => { window.__grp = { id, key: ch.dataset.g }; reload(); });
  $('#refresh').onclick = reload;
  clearInterval(state.refresh);
  if (live) state.refresh = setInterval(() => {   // quiet auto-refresh: only when the tab is visible, no window is open and you are at the top
    if (document.hidden || $('.overlay') || window.scrollY > 80 || state.view !== 'campaigns/detail') return;
    campaignDetail(id, statusFilter).then(settleView).catch(() => {});
  }, 30000);
  $('#export').onclick = async e => {
    e.target.disabled = true; e.target.textContent = 'Exporting\u2026';
    try { const r = await call('campaigns.export', id); toast('Saved to Drive: ' + r.name); reload(); } catch (err) { toast(err.message, true); e.target.disabled = false; e.target.textContent = 'Export to Drive'; }
  };
  if ($('#cont')) $('#cont').onclick = async () => { try { await driveSend(id); } catch (e) { toast(e.message, true); } reload(); };
  if ($('#retry')) $('#retry').onclick = async () => {
    try { const r = await call('campaigns.retryFailed', id); toast(r.retried + ' messages queued again'); await driveSend(id); } catch (e) { toast(e.message, true); } reload();
  };
  if ($('#stop')) $('#stop').onclick = () => {
    const m = modal('<h2>Stop this campaign?</h2><p>Unsent messages are cancelled and no more fallback calls are placed. Messages already delivered stay, and parents can still reply.</p><div class="actions"><button class="btn" id="no">Keep going</button><button class="btn danger" id="yes">Stop campaign</button></div>');
    $('#no', m).onclick = m.close;
    $('#yes', m).onclick = async () => { m.close(); try { const r = await call('campaigns.cancel', id); toast(r.stopped + ' messages cancelled'); } catch (e) { toast(e.message, true); } reload(); };
  };
  $$('[data-m]').forEach(tr => tr.onclick = () => messagePanel(c, c.messages.find(m => m.id === tr.dataset.m), reload));
}
function templateText(c) {
  let b = c.template_body || '';
  Object.keys(c.variables || {}).forEach(k => { b = b.split('{{' + k + '}}').join(c.variables[k]); });
  return b;
}
function messageDetails(m) {
  if (m.status === 'confirmed' || m.status === 'declined') return m.confirmed_via === 'admin' ? 'Recorded by an admin' : m.confirmed_via === 'voice' ? 'Answered on the phone call' : 'Answered on WhatsApp';
  if (m.status === 'cancelled') return m.parents.opted_out ? 'Parent opted out' : 'Campaign stopped before sending';
  if (m.call_status) return 'Call: ' + m.call_status.replace('-', ' ');
  if (m.call_requested_at) return 'Calling now';
  if (m.call_due_at) return (m.wa_error ? m.wa_error + ' ' : m.parents.has_whatsapp ? '' : 'No WhatsApp. ') + 'Call ' + callTime(m.call_due_at);
  if (m.wa_error) return m.wa_error;
  if (m.status === 'read') return 'Read, no reply yet';
  return '';
}
function eventSummary(e) {
  const p = e.payload || {};
  switch (e.source) {
    case 'whatsapp_status': return 'WhatsApp: ' + (p.MessageStatus || '?') + (p.ErrorCode ? ' (error ' + p.ErrorCode + ')' : '');
    case 'whatsapp_inbound': return (p.ButtonPayload ? 'Tapped' : 'Replied') + ' \u201c' + (p.Body || '') + '\u201d' + (p.recovered ? ' (recovered)' : '');
    case 'voice_gather': return 'Pressed ' + (p.Digits || 'nothing');
    case 'voice_status': return 'Call ' + (p.CallStatus || '?') + (p.CallDuration ? ', ' + p.CallDuration + ' s' : '');
    case 'admin': return 'Marked ' + p.outcome + ' by ' + p.by;
    case 'cron': return p.error ? 'Error: ' + p.error : p.recheck_status ? 'Status re-checked with Twilio: ' + p.recheck_status : 'Background job';
    default: return e.source;
  }
}
async function messagePanel(c, m, reload) {
  const o = modal('<h2>' + esc(m.parents.parent_name) + '</h2><p class="muted">' + esc(m.parents.child_name ? 'Parent of ' + m.parents.child_name + ' \u00b7 ' : '') + esc(m.parents.phone_e164) + ' \u00b7 ' + esc(m.parents.language) + '</p>' +
    '<p>' + badge(m.status) + ' <span class="muted small">' + esc(messageDetails(m)) + '</span></p>' +
    (m.reply_text ? '<p><b>Reply:</b> \u201c' + esc(m.reply_text) + '\u201d <span class="muted small">' + esc(timeAgo(m.replied_at)) + '</span></p>' : '') +
    (m.status !== 'cancelled' ? '<div class="row" style="flex:0 0 auto"><button class="btn" data-r="confirmed">Mark confirmed</button><button class="btn" data-r="declined">Mark declined</button></div><p class="small muted">Use after speaking to the parent personally.</p>' : '') +
    '<h2 style="margin-top:14px">Timeline</h2><ul class="tl" id="tl"><li class="muted">Loading\u2026</li></ul><div class="actions"><button class="btn" id="x">Close</button></div>');
  $('#x', o).onclick = o.close;
  $$('[data-r]', o).forEach(b => b.onclick = async () => { try { await call('messages.resolve', m.id, b.dataset.r); toast('Saved'); o.close(); reload(); } catch (e) { toast(e.message, true); } });
  try {
    const ev = await call('messages.events', m.id);
    $('#tl', o).innerHTML = ev.length ? ev.map(e => '<li><span class="muted small">' + esc(fmtDate(e.created_at)) + '</span> \u2014 ' + esc(eventSummary(e)) + '</li>').join('') : '<li class="muted">No events yet.</li>';
  } catch (e) { $('#tl', o).innerHTML = '<li>' + esc(e.message) + '</li>'; }
}

// ---------- parents ----------
const SAMPLE_CSV = 'parent_name,phone,child_name,institution,institution_type,class_or_year,section,language,has_whatsapp\n' +
  'Asha Rao,98765 43210,Riya Rao,Sunrise Public School,school,7,B,hi,yes\n' +
  'Vikram Shah,+919812345678,Aarav Shah,Sunrise Public School,school,7,B,en,no\n' +
  'Meera Iyer,98400 12345,Karthik Iyer,City Engineering College,college,2,,ta,yes\n';
const REPLIES_HELP = 'Replies: how many messages this parent answered (on WhatsApp, on the phone call, or recorded by staff), out of how many were sent. Red means someone should follow up personally.';

function repliesHtml(s) {
  if (!s.total) return '<span class="muted">No messages yet</span>';
  return s.responded + ' of ' + s.total + ' answered' + (s.flagged ? ' <span class="badge b-flagged">' + s.flagged + ' to follow up</span>' : '');
}

// The BOM makes Excel read the file as UTF-8.
function sampleCsvHref() { return 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + SAMPLE_CSV); }

/** One line per CSV row: Added, Updated or Rejected (with the reason). */
function uploadResultHtml(r) {
  const STATUS = { added: ['confirmed', 'Added'], updated: ['sent', 'Updated'], rejected: ['failed', 'Rejected'] };
  const lines = (r.rows || []).map(x => ({ row: x.row, name: x.parent_name, phone: x.phone, status: x.status, reason: '' }))
    .concat((r.errors || []).map(e => ({ row: e.row, name: e.parent_name || '', phone: e.phone || '', status: 'rejected', reason: e.reason })))
    .sort((a, b) => a.row - b.row);
  return '<div class="card"><b>Latest upload: ' + r.inserted + ' added, ' + r.updated + ' updated, ' + r.rejected + ' rejected.</b>' +
    (lines.length ? '<div class="scroll"><table><thead><tr><th>CSV row</th><th>Parent</th><th>Phone</th><th>Status</th><th>Reason</th></tr></thead><tbody>' +
      lines.map(x => '<tr><td>' + x.row + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.phone) + '</td><td><span class="badge b-' + STATUS[x.status][0] + '">' + STATUS[x.status][1] + '</span></td><td class="small muted">' + esc(x.reason) + '</td></tr>').join('') +
      '</tbody></table></div>' : '') + '</div>';
}

views.parents = async function () {
  const all = await call('parents.list', {});
  const f = { institution: '', class_or_year: '', section: '', hard: false, q: '' };
  let result = window.__uploadResult || null; window.__uploadResult = null;

  function filtered() {
    return all.filter(p => (!f.institution || p.institution === f.institution) && (!f.class_or_year || p.class_or_year === f.class_or_year) &&
      (!f.section || p.section === f.section) && (!f.hard || (p.stats.responded === 0 && p.stats.total >= 2)) &&
      (!f.q || (p.parent_name + ' ' + (p.child_name || '') + ' ' + p.phone_e164).toLowerCase().indexOf(f.q.toLowerCase()) >= 0));
  }
  function draw() {
    const insts = tally(all, p => p.institution, () => 1);
    const levels = f.institution ? tally(all.filter(p => p.institution === f.institution), p => p.class_or_year, () => 1) : [];
    const secs = f.class_or_year ? tally(all.filter(p => p.institution === f.institution && p.class_or_year === f.class_or_year), p => p.section, () => 1) : [];
    const rows = filtered();
    main().innerHTML = noticesHtml() +
      '<div class="head"><div><h1>Parent Info</h1><p class="sub" style="margin:0">' + all.length + (all.length === 1 ? ' parent' : ' parents') + ' saved. Upload a CSV file to add new parents or update existing ones. The newest changes are shown first.</p></div>' +
      '<div class="row" style="flex:0 0 auto"><button class="btn" id="sample">Sample CSV</button><button class="btn" id="move">Move group</button><button class="btn danger" id="delgrp">Delete group</button>' +
      '<button class="btn primary" id="upload">Upload CSV</button><input type="file" id="file" accept=".csv,text/csv" style="display:none"></div></div>' +
      (result ? uploadResultHtml(result) : '') +
      '<div class="card"><div class="row">' +
      '<div><label>Search</label><input id="q" value="' + esc(f.q) + '" placeholder="Name or phone"></div>' +
      '<div><label>School / college</label><select id="f-inst"><option value="">All</option>' + insts.map(i => opt(i.value, i.value + ' (' + i.count + ')', i.value === f.institution)).join('') + '</select></div>' +
      '<div><label>Class / year</label><select id="f-lvl" ' + (f.institution ? '' : 'disabled') + '><option value="">All</option>' + levels.map(i => opt(i.value, i.value, i.value === f.class_or_year)).join('') + '</select></div>' +
      '<div><label>Section</label><select id="f-sec" ' + (f.class_or_year ? '' : 'disabled') + '><option value="">All</option>' + secs.map(i => opt(i.value, i.value, i.value === f.section)).join('') + '</select></div></div>' +
      '<label class="inline"><input type="checkbox" id="hard" ' + (f.hard ? 'checked' : '') + '> Hard to reach: hasn’t answered any message (2 or more sent)</label></div>' +
      '<div class="card scroll">' + (rows.length ? '<table><thead><tr><th>Parent</th><th>Student</th><th>Phone</th><th>Group</th><th>Lang</th><th title="' + esc(REPLIES_HELP) + '">Replies</th><th>WhatsApp</th></tr></thead><tbody>' +
        rows.map(p => '<tr class="click" data-p="' + p.id + '"><td>' + esc(p.parent_name) + '</td><td>' + esc(p.child_name || '') + '</td><td>' + esc(p.phone_e164) + '</td><td class="small">' + esc(p.institution) + ' \u00b7 ' + (p.institution_type === 'college' ? 'Year ' : 'Class ') + esc(p.class_or_year) + (p.section ? ' ' + esc(p.section) : '') + '</td><td>' + esc(p.language) + '</td>' +
          '<td>' + repliesHtml(p.stats) + '</td><td class="small muted">' + (p.has_whatsapp ? 'Yes' : 'No') + (p.opted_out ? ' <span class="badge b-cancelled">Opted out</span>' : '') + '</td></tr>').join('') + '</tbody></table>' +
          '<p class="small muted">' + esc(REPLIES_HELP) + '</p>'
        : (all.length ? '<div class="empty">No parents match these filters.</div>' : emptyState('users', 'No parents yet', 'Upload a CSV with each parent\u2019s name, phone, school and class. Use Sample CSV to see the format.', { label: 'Upload CSV', attr: 'data-click="#upload"' }))) + '</div>';
    $('#q').oninput = e => { f.q = e.target.value; const pos = e.target.selectionStart; draw(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };
    $('#f-inst').onchange = e => { f.institution = e.target.value; f.class_or_year = ''; f.section = ''; draw(); };
    $('#f-lvl').onchange = e => { f.class_or_year = e.target.value; f.section = ''; draw(); };
    $('#f-sec').onchange = e => { f.section = e.target.value; draw(); };
    $('#hard').onchange = e => { f.hard = e.target.checked; draw(); };
    $('#sample').onclick = () => { const m = modal('<h2>Sample CSV</h2><p class="small muted">Download it and open it in Excel, or copy it into a file named parents.csv (UTF-8). Required: parent_name, phone, institution, class_or_year, has_whatsapp (yes or no). language can be en, hi or ta (blank means English).</p><pre id="csv">' + esc(SAMPLE_CSV) + '</pre><div class="actions"><a class="btn primary" id="dl" style="text-decoration:none;display:inline-block" download="parents.csv" href="' + sampleCsvHref() + '">Download (opens in Excel)</a><button class="btn" id="cp">Copy</button><button class="btn" id="x">Close</button></div>'); $('#x', m).onclick = m.close; $('#cp', m).onclick = () => { navigator.clipboard.writeText(SAMPLE_CSV).then(() => toast('Copied'), () => toast('Select and copy manually', true)); }; };
    $('#upload').onclick = () => $('#file').click();
    $('#file').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = async () => {
        try { window.__uploadResult = await call('parents.upload', String(r.result)); toast('Upload finished'); go('parents'); }
        catch (err) { toast(err.message, true); }
      };
      r.readAsText(file, 'utf-8');

    $('#move').onclick = () => groupDialog(all, false);

function groupDialog(all, isDelete) {
  const s = { inst: '', lvl: '', sec: '' };
  const m = modal('<div id="gd"></div>');
  function draw() {
    const insts = tally(all, p => p.institution, () => 1);
    const levels = s.inst ? tally(all.filter(p => p.institution === s.inst), p => p.class_or_year, () => 1) : [];
    const secs = s.lvl ? tally(all.filter(p => p.institution === s.inst && p.class_or_year === s.lvl), p => p.section, () => 1) : [];
    const n = all.filter(p => p.institution === s.inst && (!s.lvl || p.class_or_year === s.lvl) && (!s.sec || p.section === s.sec)).length;
    const nText = n + (n === 1 ? ' parent' : ' parents');
    const college = !!all.find(p => p.institution === s.inst && p.institution_type === 'college'); // colleges have no sections
    $('#gd', m).innerHTML = '<h2>' + (isDelete ? 'Delete group' : 'Move group (year-end promotion)') + '</h2>' +
      (isDelete ? '<p class="muted small">Removes every parent in the group and their message history.</p>' : '<p class="muted small">Move highest class first (e.g. 7 \u2192 8 before 6 \u2192 7).</p>') +
      '<label>School / college</label><select id="g-i"><option value="">Choose\u2026</option>' + insts.map(i => opt(i.value, i.value, i.value === s.inst)).join('') + '</select>' +
      '<label>Class / year' + (isDelete ? ' (empty = whole institution)' : '') + '</label><select id="g-l" ' + (s.inst ? '' : 'disabled') + '><option value="">' + (isDelete ? 'All' : 'Choose\u2026') + '</option>' + levels.map(i => opt(i.value, i.value, i.value === s.lvl)).join('') + '</select>' +
      '<label>Section ' + (college ? '(colleges have no sections)' : '(empty = all)') + '</label><select id="g-s" ' + (s.lvl && !college ? '' : 'disabled') + '><option value="">All</option>' + secs.map(i => opt(i.value, i.value, i.value === s.sec)).join('') + '</select>' +
      (isDelete ? '' : '<div class="grid2"><div><label>New class / year</label><input id="g-nl"></div><div><label>New section (only when moving one section)</label><input id="g-ns" ' + (college ? 'disabled' : '') + '></div></div>') +
      (s.inst ? '<p class="small">' + nText + ' affected.</p>' : '') + '<div id="gerr"></div>' +
      '<div class="actions"><button class="btn" id="x">Cancel</button><button class="btn ' + (isDelete ? 'danger' : 'primary') + '" id="go" ' + (s.inst ? '' : 'disabled') + '>' + (isDelete ? 'Delete' : 'Move') + '</button></div>';
    $('#g-i', m).onchange = e => { s.inst = e.target.value; s.lvl = ''; s.sec = ''; draw(); };
    $('#g-l', m).onchange = e => { s.lvl = e.target.value; s.sec = ''; draw(); };
    $('#g-s', m).onchange = e => { s.sec = e.target.value; draw(); };
    $('#x', m).onclick = m.close;
    $('#go', m).onclick = async () => {
      if (isDelete && !confirm('Delete ' + nText + ' permanently?')) return;
      try {
        const r = isDelete ? await call('parents.deleteGroup', { institution: s.inst, class_or_year: s.lvl || null, section: s.sec || null })
          : await call('parents.move', { source: { institution: s.inst, class_or_year: s.lvl, section: s.sec || null }, class_or_year: $('#g-nl', m).value, section: $('#g-ns', m).value });
        toast((isDelete ? r.deleted + ' deleted' : r.moved + ' moved')); m.close(); go('parents');
      } catch (e) { $('#gerr', m).innerHTML = errorsHtml(e); }
    };
  }
  draw();
}

function parentDrawer(p) {

    '<div><label>Class / year</label><input id="e-lvl" value="' + esc(p.class_or_year) + '"></div><div><label>Section</label><input id="e-sec" value="' + esc(p.section || '') + '"></div></div>' +

    '<div class="actions"><button class="btn danger" id="del" style="margin-right:auto">Delete</button><button class="btn" id="x">Close</button><button class="btn primary" id="save">Save</button></div>' +
    '<h2 style="margin-top:14px">History</h2><ul class="tl" id="hist"><li class="muted">Loading\u2026</li></ul>');
  $('#x', m).onclick = m.close;

    try {
      await call('parents.update', p.id, { parent_name: $('#e-name', m).value, phone: $('#e-phone', m).value, child_name: $('#e-child', m).value, institution: $('#e-inst', m).value,
        institution_type: $('#e-type', m).value, class_or_year: $('#e-lvl', m).value, section: $('#e-sec', m).value, language: $('#e-lang', m).value,
        has_whatsapp: $('#e-wa', m).checked, opted_out: $('#e-out', m).checked });
      toast('Saved'); m.close(); go('parents');
    } catch (e) { $('#perr', m).innerHTML = errorsHtml(e); }
  };
  $('#del', m).onclick = async () => {
    if (!confirm('Delete ' + p.parent_name + ' and their history?')) return;
    try { await call('parents.delete', p.id); toast('Deleted'); m.close(); go('parents'); } catch (e) { toast(e.message, true); }
  };
  call('parents.history', p.id).then(h => {
    $('#hist', m).innerHTML = h.length ? h.map(x => '<li>' + badge(x.status) + ' ' + esc(x.campaigns.templates.name || '') + ' \u00b7 ' + esc(x.campaigns.audience || '') + ' <span class="muted small">' + esc(timeAgo(x.updated_at)) + '</span>' + (x.reply_text ? '<br><span class="small muted">\u201c' + esc(x.reply_text) + '\u201d</span>' : '') + '</li>').join('') : '<li class="muted">No messages sent yet.</li>';
  }).catch(e => { $('#hist', m).innerHTML = '<li>' + esc(e.message) + '</li>'; });

const META_WORDS = { received: 'Received by Twilio, not yet passed to WhatsApp', pending: 'Under review at WhatsApp', paused: 'Paused by WhatsApp', disabled: 'Disabled by WhatsApp' };
function metaNote(t) {
  if (t.status !== 'pending_meta') return '';
  const st = String(t.meta_status || '').toLowerCase(), hrs = Math.floor((Date.now() - new Date(t.updated_at).getTime()) / 3600000);
  return '<div class="small muted">' + esc(META_WORDS[st] || (st ? 'Status: ' + st : 'Waiting for the first check')) + ' \u00b7 submitted ' + esc(timeAgo(t.updated_at)) + (t.meta_checked_at ? ' \u00b7 checked ' + esc(timeAgo(t.meta_checked_at)) : '') + '</div>' +
    (hrs >= 48 ? '<div class="small" style="color:var(--warn)">Longer than the usual 48 hours. Check the template in Twilio (Messaging, Content Template Builder) or ask Twilio support.</div>' : '');
}
function syncSummary(r) {
  if (!r.checked) return 'There are no template requests waiting for WhatsApp.';
  const done = [];
  if (r.approved) done.push(r.approved + (r.approved === 1 ? ' template was' : ' templates were') + ' approved');
  if (r.rejected) done.push(r.rejected + (r.rejected === 1 ? ' template was' : ' templates were') + ' rejected');
  if (done.length) return done.join(' and ') + '.' + (r.waiting && r.waiting.length ? ' The others are still being processed.' : '');
  return 'Your request is being processed. You will receive an update shortly.';
}
