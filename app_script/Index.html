<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ek Tara Communications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
  // If anything stops the app from starting, say so on screen instead of leaving a blank page.
  (function () {
    var shown = false;
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function show(msg) {
      if (shown) return; shown = true;
      var d = document.createElement('div'); d.id = 'bootfail'; d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#7f1d1d;color:#fff;padding:14px 16px;border-radius:10px;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)';
      d.innerHTML = '<b>The app hit a problem while starting.</b><br>' + esc(msg) + '<br><span style="opacity:.85">Try Ctrl+Shift+R. If it continues, add <b>?diag=1</b> to the end of this page\u2019s address, open it, and send what it shows to the project owner.</span>';
      (document.body || document.documentElement).appendChild(d);
    }
    window.__bootFail = show;
    window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '')); });
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason); });
  })();
</script>
<script>
  (function () {
    var m = 'auto'; try { m = localStorage.getItem('ektara-theme') || 'auto'; } catch (e) {}
    var dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.dataset.mode = m;
  })();
</script>
<style>
:root {
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Tamil", sans-serif;
  --font-body: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Tamil", sans-serif;
  --bg:#eef1ee; --bg-2:#e2e8e4; --card:#ffffff; --text:#12201d; --text-2:#3b4a46; --muted:#5b6a65; --line:#d8dfdb; --line-2:#c3cdc8;
  --brand:#0e5e55; --ok:#0f7a4d; --warn:#9a5b00; --bad:#b42318; --info:#1b5fa8; --violet:#5b4fc7;
  --parent:#0e5e55; --donor:#9b2f5e; --overview:#7a5a06;
  --acc:var(--brand); --acc-ink:#ffffff;
  --r-s:7px; --r-m:12px; --r-l:18px;
  --sh-1:0 1px 2px rgba(18,32,29,.05);
  --sh-2:0 18px 44px -14px rgba(18,32,29,.32), 0 3px 10px rgba(18,32,29,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg:#0c1412; --bg-2:#16211e; --card:#131c19; --text:#e8f0ed; --text-2:#c3d0cb; --muted:#93a39d; --line:#25332f; --line-2:#34453f;
  --brand:#52c1b0; --ok:#4cc38a; --warn:#e3a93f; --bad:#f28b82; --info:#6db0f0; --violet:#a79bff;
  --parent:#52c1b0; --donor:#f08db5; --overview:#e2b84d; --acc-ink:#07130f;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 22px 52px -14px rgba(0,0,0,.75), 0 3px 10px rgba(0,0,0,.45);
  color-scheme: dark;
}
html[data-div="parent"] { --acc:var(--parent); }
html[data-div="donor"] { --acc:var(--donor); }
html[data-div="overview"] { --acc:var(--overview); }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; font:15px/1.5 var(--font-body); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body.noscroll { overflow:hidden; }
h1, h2, h3 { font-family:var(--font-display); font-weight:650; letter-spacing:-.015em; margin:0; text-wrap:balance; }
h1 { font-size:30px; line-height:1.15; letter-spacing:-.025em; margin-bottom:4px; }
h2 { font-size:17px; margin-bottom:10px; } h3 { font-size:16px; }
p { text-wrap:pretty; }
a { color:var(--acc); text-underline-offset:3px; }
::selection { background:color-mix(in srgb, var(--acc) 28%, transparent); }
:focus-visible { outline:3px solid color-mix(in srgb, var(--acc) 60%, transparent); outline-offset:2px; border-radius:4px; }
.sub { color:var(--muted); margin:0 0 18px; } .muted { color:var(--muted); } .small { font-size:12.5px; }
ul { padding-left:20px; }
pre { background:var(--bg); border:1px solid var(--line); padding:12px; border-radius:var(--r-s); overflow:auto; font-size:12.5px; }

.skip { position:fixed; left:12px; top:-60px; z-index:100; background:var(--acc); color:var(--acc-ink); padding:9px 14px; border-radius:var(--r-s); text-decoration:none; font-weight:600; transition:top .15s; }
.skip:focus { top:12px; }

/* ---- network activity line ---- */
#topbar { position:fixed; top:0; left:0; right:0; height:3px; z-index:90; pointer-events:none; opacity:0; transition:opacity .25s ease; overflow:hidden; }
#topbar.on { opacity:1; transition-delay:.12s; }
#topbar i { display:block; height:100%; width:38%; background:var(--acc); border-radius:0 3px 3px 0; animation:slide 1.1s var(--ease) infinite; }
@keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(280%); } }

/* ---- the string: Ek Tara's signature loader ---- */
.string { display:block; fill:none; stroke:var(--acc,var(--brand)); stroke-width:2.6; stroke-linecap:round; overflow:visible; }
.string circle { fill:var(--acc,var(--brand)); stroke:none; }
.string.sm { width:58px; height:20px; } .string.md { width:110px; height:36px; } .string.lg { width:190px; height:63px; }
#splash { position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:var(--bg); transition:opacity .38s ease, visibility .38s; }
#splash.out { opacity:0; visibility:hidden; }
.sp-in { text-align:center; display:grid; justify-items:center; gap:10px; }
.sp-word { font-family:var(--font-display); font-weight:700; font-size:30px; letter-spacing:-.02em; margin-top:6px; }
.sp-sub { color:var(--muted); font-size:14px; }

/* ---- skeletons ---- */
.sk { background:linear-gradient(90deg, var(--bg-2) 25%, color-mix(in srgb, var(--bg-2) 55%, var(--card)) 38%, var(--bg-2) 63%); background-size:400% 100%; animation:shimmer 1.5s ease-in-out infinite; border-radius:6px; }
@keyframes shimmer { from { background-position:100% 50%; } to { background-position:0 50%; } }
.sk-top { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; margin-bottom:18px; }
.sk-h1 { height:30px; width:min(320px,60%); margin-bottom:10px; } .sk-sub { height:14px; width:min(460px,80%); margin-bottom:22px; }
.sk-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); } .sk-row:last-child { border:0; } .sk-row .sk { height:14px; }
.sk-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; } .sk-tile { height:84px; border-radius:var(--r-m); }
.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---- header ---- */
header { position:sticky; top:0; z-index:30; }
header::before { content:""; position:absolute; inset:0; z-index:-1; background:color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter:saturate(1.5) blur(14px); -webkit-backdrop-filter:saturate(1.5) blur(14px); border-bottom:1px solid var(--line); }
.bar { max-width:1160px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:12px; }
.logo { display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.02em; color:var(--text); }
.mark { width:30px; height:30px; flex:none; }
.mark-img { height:34px; width:auto; max-width:170px; object-fit:contain; flex:none; display:block; border-radius:0; }   /* never rounded: a rectangular logo must keep its corners */
.foot-brand .mark-img { height:28px; } .sp-logo { max-width:240px; max-height:100px; object-fit:contain; border-radius:0; }
html[data-theme="dark"] .mark-img, html[data-theme="dark"] .sp-logo { background:#fff; box-shadow:0 0 0 5px #fff; margin:5px; }   /* a light plate behind the logo, drawn outside it so nothing is clipped */
html[data-logo="wide"] .logo > span, html[data-logo="wide"] .sp-word { display:none; }                          /* the logo already carries the name */
.divbadge { font-size:12.5px; font-weight:650; padding:4px 11px; border-radius:99px; color:var(--acc); background:color-mix(in srgb, var(--acc) 13%, transparent); white-space:nowrap; }
nav.tabs { display:flex; gap:2px; margin-left:4px; }
nav.tabs a { display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px; color:var(--muted); font-weight:560; cursor:pointer; text-decoration:none; transition:background .15s, color .15s; white-space:nowrap; }
nav.tabs a:hover { color:var(--text); background:var(--bg-2); }
nav.tabs a.on { color:var(--acc); background:color-mix(in srgb, var(--acc) 12%, transparent); }
nav.tabs a[aria-current="page"] { color:var(--acc); }
.ni { display:none; } .ni svg { width:22px; height:22px; }
.tools { margin-left:auto; display:flex; align-items:center; gap:6px; }
.ibtn { width:36px; height:36px; display:grid; place-items:center; border:0; background:transparent; color:var(--text-2); border-radius:50%; cursor:pointer; transition:background .15s; }
.ibtn:hover { background:var(--bg-2); } .ibtn svg { width:19px; height:19px; }
.kbtn { display:flex; align-items:center; gap:8px; height:36px; padding:0 8px 0 12px; border:1px solid var(--line-2); background:var(--card); color:var(--muted); border-radius:99px; cursor:pointer; font:inherit; font-size:13.5px; }
.kbtn:hover { border-color:var(--acc); color:var(--text); } .kbtn svg { width:17px; height:17px; }
.kbtn span, .kbtn kbd, .me-email { display:none; } .kbtn { padding:0; width:36px; justify-content:center; }
kbd { font:600 11.5px/1 var(--font-body); padding:3px 6px; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:5px; background:var(--bg); color:var(--text-2); }
.me { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; max-width:220px; }
.avatar { width:30px; height:30px; border-radius:50%; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
.me-email { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#switch { display:inline-flex; align-items:center; gap:6px; } #switch svg { width:15px; height:15px; }

main { width:100%; max-width:1160px; margin:0 auto; padding:28px 20px 48px; flex:1; outline:none; }
main:focus, main:focus-visible, .modal:focus, .modal:focus-visible { outline:none; }
main.enter { animation:viewin .24s var(--ease); }
@keyframes viewin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.head .sub { margin:0; max-width:64ch; }

/* ---- surfaces ---- */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:18px; margin-bottom:16px; }
.alert { padding:11px 14px; border-radius:var(--r-s); margin-bottom:14px; background:color-mix(in srgb, var(--bad) 9%, var(--card)); border:1px solid color-mix(in srgb, var(--bad) 28%, var(--line)); border-left:4px solid var(--bad); color:var(--text); }
.alert.ok { background:color-mix(in srgb, var(--ok) 9%, var(--card)); border-color:color-mix(in srgb, var(--ok) 28%, var(--line)); border-left-color:var(--ok); }
.alert.info { background:color-mix(in srgb, var(--info) 9%, var(--card)); border-color:color-mix(in srgb, var(--info) 28%, var(--line)); border-left-color:var(--info); }
.alert ul { margin:4px 0 0 18px; padding:0; }

/* ---- controls ---- */
.btn { position:relative; font:inherit; font-weight:580; border:1px solid var(--line-2); background:var(--card); color:var(--text); padding:8px 15px; border-radius:var(--r-s); cursor:pointer; transition:background .15s, border-color .15s, transform .08s; }
.btn:hover { background:var(--bg); border-color:var(--muted); } .btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.5; cursor:default; transform:none; }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
.btn.primary:hover { background:color-mix(in srgb, var(--acc) 86%, #000); border-color:color-mix(in srgb, var(--acc) 86%, #000); }
.btn.danger { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, var(--line-2)); } .btn.danger:hover { background:color-mix(in srgb, var(--bad) 8%, var(--card)); }
.btn.small { padding:4px 10px; font-size:12.5px; }
[data-tip] { position:relative; }
[data-tip]:not(.is-busy):hover::before, [data-tip]:not(.is-busy):focus-visible::before { content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:60; width:max-content; max-width:240px; padding:6px 9px; border-radius:6px; background:var(--text); color:var(--card); font-size:12.5px; font-weight:450; line-height:1.4; text-align:left; white-space:normal; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.18); }
.tip { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-left:5px; border-radius:50%; border:1px solid var(--line-2); color:var(--muted); font-size:11px; font-weight:600; cursor:help; vertical-align:1px; }
.btn.is-busy { color:transparent !important; pointer-events:none; }
.btn.is-busy::after { content:""; position:absolute; inset:0; margin:auto; width:16px; height:16px; border-radius:50%; border:2px solid var(--text); border-right-color:transparent; animation:spin .7s linear infinite; }
.btn.primary.is-busy::after { border-color:var(--acc-ink); border-right-color:transparent; }
@keyframes spin { to { transform:rotate(360deg); } }
input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-s); padding:9px 11px; width:100%; transition:border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--muted) 75%, transparent); }
textarea { min-height:96px; resize:vertical; }
label { display:block; font-size:12.5px; font-weight:560; color:var(--text-2); margin:12px 0 5px; }
label.inline { display:flex; align-items:center; gap:8px; color:var(--text); font-size:14.5px; font-weight:450; margin:12px 0; } label.inline input { width:auto; accent-color:var(--acc); }
input[type="checkbox"] { accent-color:var(--acc); }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; } .row > * { flex:1 1 160px; } .row > .btn { flex:0 0 auto; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } @media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
.checks { display:flex; flex-wrap:wrap; gap:6px 16px; margin:6px 0; } .checks label { display:flex; align-items:center; gap:7px; margin:0; font-size:14px; font-weight:450; color:var(--text); } .checks input { width:auto; }

/* ---- data ---- */
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 12px; font-size:12.5px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line-2); white-space:nowrap; }
td { text-align:left; padding:12px; border-bottom:1px solid var(--line); vertical-align:top; }
tbody tr:last-child td { border-bottom:0; }
tr.click { cursor:pointer; } tr.click:hover td { background:color-mix(in srgb, var(--acc) 6%, var(--card)); }
tr.click:focus-visible { outline:2px solid var(--acc); outline-offset:-2px; }
/* Donor list: row edit button and the opt-in toggle */
.d-sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.d-act { width:1%; white-space:nowrap; text-align:right; vertical-align:middle; }
details.d-msgs { margin-top:12px; }
details.d-msgs > summary { cursor:pointer; font-weight:600; font-size:1.05em; padding:4px 0; }
.d-msg-list { max-height:280px; overflow-y:auto; padding-right:6px; }
.d-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 4px 3px 10px; border-radius:99px; background:color-mix(in srgb, var(--acc) 12%, transparent); color:var(--acc); font-size:12.5px; font-weight:560; line-height:1.4; border:1px solid transparent; }
.d-chip.sm { padding:1px 8px; font-size:11.5px; }
.d-chip .d-n { color:var(--muted); font-weight:500; }
.d-chip button { border:0; background:transparent; color:inherit; cursor:pointer; width:20px; height:20px; padding:0; border-radius:50%; display:grid; place-items:center; font:inherit; font-size:15px; line-height:1; }
.d-chip button:hover { background:color-mix(in srgb, var(--acc) 22%, transparent); }
.d-chip.off { background:transparent; border:1px dashed var(--line-2); color:var(--muted); text-decoration:line-through; }
.d-chip.off button { text-decoration:none; }
.d-tagbox, .d-tags { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px; border:1px solid var(--line-2); border-radius:var(--r-s); min-height:44px; background:var(--card); }
.d-tags:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
.d-tags input { flex:1 1 140px; min-width:120px; border:0; padding:4px; box-shadow:none !important; background:transparent; }
.d-pager { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; padding:12px 4px 2px; border-top:1px solid var(--line); margin-top:4px; }
.d-pager-size { display:flex; align-items:center; gap:8px; margin:0; font-size:13px; font-weight:450; color:var(--text-2); }
.d-pager-size select { width:auto; padding:5px 8px; }
.d-pager-nav { display:flex; align-items:center; gap:10px; }
.d-chan { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; margin-right:auto; }
.badge.b-logged { --bc:var(--ok); }
.d-req { color:var(--bad); font-weight:700; margin-left:2px; }
.d-trig { cursor:help; border-bottom:1px dotted currentColor; }
.btn.d-edit { display:inline-grid; place-items:center; width:32px; height:32px; padding:0; }
.btn.d-edit svg { width:16px; height:16px; }
label.d-switch { display:inline-flex; align-items:center; gap:10px; margin:0; min-height:38px; cursor:pointer; font-size:14px; font-weight:450; color:var(--text); }
.d-switch input { position:absolute; opacity:0; width:1px; height:1px; }
.d-switch .d-track { position:relative; flex:none; width:40px; height:22px; border-radius:99px; background:var(--line-2); transition:background .15s; }
.d-switch .d-track::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s var(--ease, ease); }
.d-switch input:checked + .d-track { background:var(--acc); }
.d-switch input:checked + .d-track::after { transform:translateX(18px); }
.d-switch input:focus-visible + .d-track { outline:3px solid color-mix(in srgb, var(--acc) 60%, transparent); outline-offset:2px; }
.badge { --bc:var(--muted); display:inline-flex; gap:6px; align-items:center; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; background:color-mix(in srgb, var(--bc) 13%, transparent); color:var(--bc); }
.badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.b-sent,.b-delivered,.b-sending { --bc:var(--info); } .b-read { --bc:var(--violet); } .b-confirmed,.b-approved { --bc:var(--ok); }
.b-declined,.b-pending_meta,.b-held,.b-awaiting_confirmation { --bc:var(--warn); } .b-flagged,.b-rejected,.b-failed { --bc:var(--bad); } .b-cancelled,.b-skipped { --bc:var(--muted); }
.bar2 { display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--bg-2); }
.bar2 span { display:block; transition:width .5s var(--ease); }
.c-confirmed { background:var(--ok); } .c-declined { background:var(--warn); } .c-awaiting { background:var(--info); } .c-flagged { background:var(--bad); } .c-failed { background:var(--muted); } .c-cancelled { background:var(--line-2); }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.chip { border:1px solid var(--line-2); background:var(--card); border-radius:99px; padding:5px 13px; cursor:pointer; font-size:13.5px; font-weight:520; transition:background .15s, border-color .15s; user-select:none; }
.chip:hover { border-color:var(--acc); } .chip.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }

  // Class and section choices for the picked schools (and classes), with parent counts.

      lv.forEach(l => {

    const tidy = () => { s.lvls = s.lvls.filter(k => levelChoices().some(l => l.key === k)); s.secs = s.secs.filter(k => sectionChoices().some(x => x.key === k)); };
    $('#c-name').oninput = e => { s.name = e.target.value; };
    $$('[data-all-inst]').forEach(c => c.onclick = () => { s.insts = s.insts.length === insts.length ? [] : insts.map(i => i.value); tidy(); draw(); });
    $$('[data-inst]').forEach(c => c.onclick = () => { s.insts = toggle(s.insts, insts[c.dataset.inst].value); tidy(); draw(); });
    $$('[data-all-lvl]').forEach(c => c.onclick = () => { s.lvls = []; s.secs = []; draw(); });
    $$('[data-lvl]').forEach(c => c.onclick = () => { s.lvls = toggle(s.lvls, levels[c.dataset.lvl].key); tidy(); draw(); });

      const pick = li => { if (li && li.dataset.tpl) { s.tpl = li.dataset.tpl; s.values = {}; draw(); } };

// Time picker value "14:05" <-> message text "2:05 PM".
function to12h(v) {
  const m = /^(\d{2}):(\d{2})/.exec(v || '');
  if (!m) return '';
  const h = Number(m[1]);
  return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
}
function to24h(v) {
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(v || '');
  if (!m) return '';
  const h = Number(m[1]) % 12 + (m[3].toUpperCase() === 'PM' ? 12 : 0);
  return ('0' + h).slice(-2) + ':' + m[2];
}

// Apps Script has no background jobs: the page keeps asking the server to send the next batch.
async function driveSend(id, total) {
  const m = modal('<div class="busy-modal">' + stringSvg('md') + '<h2>Sending\u2026</h2><p id="p" class="muted" style="margin:0">Starting\u2026</p><div class="meter"><i id="mt"></i></div><p class="small muted" style="margin:0">Keep this tab open. If you close it, the background job finishes the rest within about 5\u201310 minutes.</p></div>');
  m.dataset.noesc = '1';
  try {
    for (let tries = 0; ;) {
      let r;
      try { r = await call('campaigns.sendBatch', id); tries = 0; }
      catch (e) {
        // No status = not a clear "no" from the server (e.g. busy lock, network): wait and try again, up to 3 times.
        if (e.status || ++tries > 3) throw e;
        $('#p', m).textContent = 'The server is busy, trying again\u2026';
        await new Promise(res => setTimeout(res, 5000));
        continue;
      }
      $('#p', m).textContent = r.remaining ? r.remaining + (total ? ' of ' + total : '') + ' still to send\u2026' : 'Done.';
      if (total) $('#mt', m).style.width = Math.round((total - r.remaining) / total * 100) + '%';
      if (!r.remaining || r.status === 'cancelled') break;
    }
    await showDone(m, total ? 'Sent ' + total + (total === 1 ? ' message' : ' messages') : 'Sent', 'Delivery and replies will appear on the campaign page.');
  } finally { m.close(); }
}

function templateText(c) {

}
function messageDetails(m) {

  if (m.call_status) return 'Call: ' + m.call_status.replace('-', ' ');
  if (m.call_requested_at) return 'Calling now';
  if (m.call_due_at) return (m.wa_error ? m.wa_error + ' ' : '') + 'Call ' + callTime(m.call_due_at);
  if (m.wa_error) return m.wa_error;
  if (m.status === 'read') return 'Read, no reply yet';

}
function eventSummary(e) {
  const p = e.payload || {};
  switch (e.source) {
    case 'whatsapp_status': return 'WhatsApp: ' + (p.MessageStatus || '?') + (p.ErrorCode ? ' (error ' + p.ErrorCode + ')' : '');
    case 'whatsapp_inbound': return (p.ButtonPayload ? 'Tapped' : 'Replied') + ' \u201c' + (p.Body || '') + '\u201d' + (p.recovered ? ' (recovered)' : '');
    case 'voice_gather': return 'Pressed ' + (p.Digits || 'nothing');
    case 'voice_status': return 'Call ' + (p.CallStatus || '?') + (p.CallDuration ? ', ' + p.CallDuration + ' s' : '');
    case 'admin': return 'Marked ' + p.outcome + ' by ' + p.by;
    case 'cron': return p.error ? 'Error: ' + p.error : p.recheck_status ? 'Status re-checked with Twilio: ' + p.recheck_status : 'Background job';
    default: return e.source;
  }
}

/** One line per CSV row: Added, Updated or Rejected (with the reason). */
function uploadResultHtml(r) {
  const STATUS = { added: ['confirmed', 'Added'], updated: ['sent', 'Updated'], rejected: ['failed', 'Rejected'] };
  const lines = (r.rows || []).map(x => ({ row: x.row, name: x.parent_name, phone: x.phone, status: x.status, reason: '' }))
    .concat((r.errors || []).map(e => ({ row: e.row, name: e.parent_name || '', phone: e.phone || '', status: 'rejected', reason: e.reason })))

      lines.map(x => '<tr><td>' + x.row + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.phone) + '</td><td><span class="badge b-' + STATUS[x.status][0] + '">' + STATUS[x.status][1] + '</span></td><td class="small muted">' + esc(x.reason) + '</td></tr>').join('') +

const META_WORDS = { received: 'Received by Twilio, not yet passed to WhatsApp', pending: 'Under review at WhatsApp', paused: 'Paused by WhatsApp', disabled: 'Disabled by WhatsApp' };
function metaNote(t) {
  if (t.status !== 'pending_meta') return '';
  const st = String(t.meta_status || '').toLowerCase(), hrs = Math.floor((Date.now() - new Date(t.updated_at).getTime()) / 3600000);
  return '<div class="small muted">' + esc(META_WORDS[st] || (st ? 'Status: ' + st : 'Waiting for the first check')) + ' \u00b7 submitted ' + esc(timeAgo(t.updated_at)) + (t.meta_checked_at ? ' \u00b7 checked ' + esc(timeAgo(t.meta_checked_at)) : '') + '</div>' +
    (hrs >= 48 ? '<div class="small" style="color:var(--warn)">Longer than the usual 48 hours. Check the template in Twilio (Messaging, Content Template Builder) or ask Twilio support.</div>' : '');
}
function syncSummary(r) {
  if (!r.checked) return 'There are no template requests waiting for WhatsApp.';
  const done = [];
  if (r.approved) done.push(r.approved + (r.approved === 1 ? ' template was' : ' templates were') + ' approved');
  if (r.rejected) done.push(r.rejected + (r.rejected === 1 ? ' template was' : ' templates were') + ' rejected');
  if (done.length) return done.join(' and ') + '.' + (r.waiting && r.waiting.length ? ' The others are still being processed.' : '');
  return 'Your request is being processed. You will receive an update shortly.';
}

function applyTheme(mode) {
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.dataset.mode = mode;

  applyTheme(next); toast('Theme: ' + label(next));
}

function contactLogForm(d, parentModal) {

/** The required fields of the contact form. Returns an error message, or '' when all is filled in. */
function dMissingRequired(root) {
  const missing = [['f-name', 'Name'], ['f-seg', 'Segment']].filter(x => { const e = $('#' + x[0], root); return e && !String(e.value || '').trim(); });
  if (missing.length) { const e = $('#' + missing[0][0], root); if (e) e.focus(); }
  return missing.length ? missing.map(x => x[1]).join(' and ') + (missing.length > 1 ? ' are' : ' is') + ' required.' : '';
}

  inp.oninput = () => {
    sel = 0; clearTimeout(timer); const q = inp.value.trim();
    if (state.division === 'donor' && q.length >= 2) timer = setTimeout(async () => { const my = ++seq; try { const ds = await call('donor.donors.list', { q }); if (my !== seq) return; found = ds.slice(0, 5).map(d => ({ group: 'Contacts', label: d.name, icon: 'heart', hint: d.segment, run: () => donorModal(d.id) })); draw(); } catch (e) { /* ignore */ } }, 220);
    else found = [];
    draw();
  };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % Math.max(1, rows.length); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + rows.length) % Math.max(1, rows.length); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
    else if (e.key === 'Escape') { e.preventDefault(); o.close(); }
  };
  list.onclick = e => { const li = e.target.closest('li[data-i]'); if (li) run(Number(li.dataset.i)); };
  list.onmousemove = e => { const li = e.target.closest('li[data-i]'); if (li && Number(li.dataset.i) !== sel) { sel = Number(li.dataset.i); $$('li[role=option]', list).forEach(x => x.setAttribute('aria-selected', x.dataset.i == sel)); } };
  draw(); inp.focus();
}
$('#cmdbtn').onclick = openPalette;

function showShortcuts() {
  const d = state.division, rows = [['Ctrl K or Cmd K', 'Search pages, actions and donors'], ['?', 'Show this list'], ['Esc', 'Close a window']];
  if (d === 'parent') rows.push(['G then C', 'Campaigns'], ['G then P', 'Parents'], ['G then T', 'Templates']);
  if (d === 'donor') rows.push(['G then O', 'Overview'], ['G then D', 'Contacts'], ['G then C', 'Campaigns'], ['G then T', 'Templates'], ['G then B', 'Broadcasts'], ['G then Q', 'Queue']);
  const m = modal('<h2>Keyboard shortcuts</h2><dl class="keys">' + rows.map(r => '<dt>' + r[0].split(' ').map(k => /^(or|then)$/.test(k) ? ' ' + k + ' ' : '<kbd>' + esc(k) + '</kbd>').join('') + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl><div class="actions"><button class="btn primary" id="x">Done</button></div>');
  $('#x', m).onclick = m.close;
}
$('#f-keys').onclick = showShortcuts;
let gPending = false, gTimer = null;
const G_MAP = { parent: { c: 'campaigns', p: 'parents', t: 'templates' }, donor: { o: 'donor/home', d: 'donor/donors', c: 'donor/campaigns', t: 'donor/templates', b: 'donor/broadcasts', q: 'donor/queue' } };
document.addEventListener('keydown', e => {
  const t = e.target, typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if ($('.overlay.cmd')) $('.overlay.cmd').close(); else openPalette(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('.overlay')) return;
  if (e.key === '?') { e.preventDefault(); showShortcuts(); return; }
  if (e.key === '/' && $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  if (gPending) { clearTimeout(gTimer); gPending = false; const v = (G_MAP[state.division] || {})[e.key.toLowerCase()]; if (v) { e.preventDefault(); go(v); } return; }
  if (e.key.toLowerCase() === 'g' && G_MAP[state.division]) { gPending = true; gTimer = setTimeout(() => { gPending = false; }, 1200); }
});

// ---------- boot ----------

// ================= Users and access (administrators) =================
const FILE_NOTES = {
  access: 'Who can use the app, and the totals shown on the Organisation Overview. Everyone signed in can read it; only administrators can change it.',
  parent: 'Parents, parent campaigns and messages. Shared only with people who have Parent Communication access.',
  donor: 'Donors, donations, donor campaigns and messages. Shared only with people who have Donor Communication access.'
};
const CAP_LABELS = { users_parent: 'Parent users', users_donor: 'Donor users', audit: 'Access log' };
const roleBadge = u => u.owner ? '<span class="badge b-confirmed">Owner</span>' : u.role === 'master' ? '<span class="badge b-confirmed">Master</span>' : u.role === 'admin' ? '<span class="badge b-sent">Administrator</span>' : 'Staff';
// What the signed-in person may do to a given person (the server enforces the same rules).
function canManage(actor, u) {
  if (actor.role === 'master') return !u.owner || u.email === actor.email;
  if (u.role !== 'staff') return false;
  return (!u.parent_access || actor.caps.indexOf('users_parent') >= 0) && (!u.donor_access || actor.caps.indexOf('users_donor') >= 0) && (actor.caps.indexOf('users_parent') >= 0 || actor.caps.indexOf('users_donor') >= 0);
}

views['admin/users'] = async function () {
  const me = state.session.user, isMaster = me.role === 'master', canAudit = isMaster || me.caps.indexOf('audit') >= 0;
  const [users, files, log, addr] = await Promise.all([call('admin.users.list'), call('admin.files'), canAudit ? call('admin.log') : Promise.resolve(null), call('admin.addresses')]);
  const tick = v => v ? '<span class="badge b-approved">Yes</span>' : '<span class="muted">No</span>';
  const masters = users.filter(u => u.role === 'master' && u.active).length;
  const until = u => u.expires_on ? (u.expired ? '<span class="badge b-cancelled">Ended ' + esc(u.expires_on) + '</span>' : '<span class="small">' + esc(u.expires_on) + '</span>') : '<span class="muted">No end date</span>';
  main().innerHTML = '<p><button class="link" id="back">Back to your workspace</button></p>' +
    '<div class="head"><div><h1>Users and access</h1><p class="sub">Choose who can use the app and which department each person can open. Saving a person also shares or unshares the Google Sheets, so the departments stay separate.</p></div><button class="btn primary" id="addu">Add user</button></div>' +
    (me.owner && masters < 2 ? '<div class="alert info"><b>You are the only master administrator.</b> Appoint a second one so access can still be managed if you are away. Also keep the three Google Sheets in an organisation account (not a personal one) with 2-step verification turned on.</div>' : '') +
    '<div class="card scroll"><table><thead><tr><th>Person</th><th>Role</th><th>Parent</th><th>Donor</th><th>Overview</th><th>Access until</th><th>Status</th><th></th></tr></thead><tbody>' + users.map(u =>
      '<tr><td><b>' + esc(u.full_name || u.email) + '</b>' + (u.email === me.email ? ' <span class="tag">You</span>' : '') + '<div class="small muted">' + esc(u.email) + '</div></td><td>' + roleBadge(u) +
      (u.role === 'admin' ? '<div class="small muted">' + u.caps.map(c => esc(CAP_LABELS[c] || c)).join(', ') + '</div>' : '') + '</td><td>' + tick(u.parent_access) + '</td><td>' + tick(u.donor_access) + '</td><td>' + tick(u.org_overview) + '</td><td>' + until(u) + '</td><td>' +
      (u.active && !u.expired ? '<span class="badge b-approved">Active</span>' : '<span class="badge b-cancelled">Inactive</span>') + '</td><td>' + (canManage(me, u) ? '<button class="btn small" data-e="' + esc(u.email) + '">Edit</button>' : '<span class="muted small">View only</span>') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<details class="card"><summary style="cursor:pointer;font-weight:600">What each role can do</summary><div class="scroll" style="margin-top:10px"><table><thead><tr><th>Role</th><th>Can do</th></tr></thead><tbody>' +
      '<tr><td><b>Owner</b></td><td class="small">The person who set up the project. Always a master administrator, cannot be removed or locked out, and is the only one who appoints other masters.</td></tr>' +
      '<tr><td><b>Master</b></td><td class="small">Everything, in every department: add and change administrators and staff, give Organisation Overview access, see the access log, check and fix file sharing. Masters can open all three files.</td></tr>' +
      '<tr><td><b>Administrator</b></td><td class="small">Only what a master gave them: <b>Parent users</b> (add and manage parent staff), <b>Donor users</b> (same for donor staff), and/or <b>Access log</b> (see changes and check who can open each file). They manage ordinary staff only, never other administrators.</td></tr>' +
      '<tr><td><b>Staff</b></td><td class="small">Work in the departments they were given. Can set an end date so access stops by itself.</td></tr></tbody></table></div></details>' +
    '<div class="card"><h2>Where the data lives</h2><p class="small muted" style="margin-top:0">Three separate Google Sheets. Someone who is not shared on a sheet cannot open it, in the app or in Google Drive.</p><div class="scroll"><table><tbody>' + files.map(f =>
      '<tr><td style="width:28%"><b>' + esc(f.label) + '</b><div class="small muted">' + esc(f.name) + '</div></td><td class="small">' + esc(FILE_NOTES[f.file]) + '</td><td style="white-space:nowrap">' + (f.url ? '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">Open sheet</a>' : '<span class="muted small">' + esc(f.error || 'Not created yet') + '</span>') + '</td></tr>').join('') + '</tbody></table></div></div>' +
    '<div class="card"><h2>App addresses: one is enough</h2>' + (addr.instant
      ? '<p class="small muted" style="margin-top:0">Instant updates are <b>on</b>: the project is published at two web addresses.</p>'
      : '<p class="small muted" style="margin-top:0"><b>One-address mode.</b> Messages send straight away. Delivery ticks and parents\u2019 replies are fetched from Twilio every few minutes instead of arriving instantly. Phone calls (not in use yet) would need the second address.</p>') +
      '<div class="scroll"><table><tbody>' +
      '<tr><td style="width:22%"><b>Staff app</b></td><td class="small">The link you share with your team, and the one you are using right now. People sign in with Google. In Deploy, Manage deployments it is set to: <i>Execute as: User accessing the web app</i> and <i>Who has access: Anyone with Google account</i>.</td><td class="small muted">The address in your browser</td></tr>' +
      '<tr><td><b>Twilio address</b><div class="small muted">optional</div></td><td class="small">Only needed for instant updates and phone calls. Twilio uses it to call the app back; nobody opens it. Set to: <i>Execute as: Me</i> and <i>Who has access: Anyone</i>. Saved in settings as <code>PUBLIC_BASE_URL</code>.</td><td class="small">' +
        (addr.twilio ? '<code style="word-break:break-all">' + esc(addr.twilio) + '</code> <button class="btn small" id="cpt">Copy</button>' : '<span class="muted">Not set: not needed</span>') + '</td></tr></tbody></table></div>' +
      '<p class="small muted" style="margin-bottom:0">After any update, make a <b>New version</b> on each address you use. To test the Twilio address, type <code>?hook=ping</code> after <code>/exec</code> and open it; it should say &ldquo;webhook ok&rdquo;.</p></div>' +
    (canAudit ? '<div class="card"><h2>Check who can open each file</h2><p class="small muted" style="margin-top:0">Compares the people shared on each Google Sheet with what is set above. It catches sheets shared by hand in Google Drive.</p><button class="btn" id="audit">Check access</button><div id="auditout" style="margin-top:14px"></div></div>' +
      '<div class="card"><h2>Recent changes</h2>' + (log.length ? '<ul class="tl">' + log.map(l => '<li><b>' + esc(l.action.replace('.', ' ')) + '</b> ' + esc(l.email) + ' <span class="muted small">by ' + esc(l.by) + ' \u00b7 ' + esc(timeAgo(l.at)) + '</span>' + (l.details ? '<div class="small muted">' + esc(l.details) + '</div>' : '') + '</li>').join('') + '</ul>' : '<p class="muted">Nothing yet.</p>') + '</div>' : '');
  $('#back').onclick = goHome;
  const cpt = $('#cpt'); if (cpt) cpt.onclick = () => navigator.clipboard.writeText(addr.twilio).then(() => toast('Copied'), () => toast('Select the address and copy it by hand', true));
  $('#addu').onclick = () => userForm(null);
  $$('[data-e]').forEach(b => b.onclick = () => userForm(users.find(u => u.email === b.dataset.e)));
  if (canAudit) $('#audit').onclick = runAudit;
  async function runAudit() {
    const out = $('#auditout'); out.innerHTML = '<div class="small muted">Checking\u2026</div>';
    try {
      const r = await call('admin.audit'), bad = r.reduce((n, f) => n + f.problems, 0), who = h => h === 'edit' ? 'Can edit' : h === 'view' ? 'Can view' : h === 'owner' ? 'Owner' : 'Nothing';
      out.innerHTML = (bad ? '<div class="alert">' + bad + ' difference' + (bad === 1 ? '' : 's') + ' found. Someone can open a file they should not, or cannot open one they should.</div>' : '<div class="alert ok">Everything matches. Each person can open exactly what they should.</div>') +
        r.map(f => '<h3 style="margin:14px 0 6px">' + esc(f.label) + '</h3>' + (f.error ? '<p class="muted small">' + esc(f.error) + '</p>' : '<div class="scroll"><table><thead><tr><th>Person</th><th>Has now</th><th>Should have</th><th></th></tr></thead><tbody>' + f.people.map(p =>
          '<tr><td>' + esc(p.email) + '</td><td>' + who(p.has) + '</td><td>' + who(p.should) + '</td><td>' + (p.ok ? '<span class="badge b-approved">OK</span>' : '<span class="badge b-failed">Differs</span>') + '</td></tr>').join('') + '</tbody></table></div>')).join('') +
        (bad && isMaster ? '<div class="actions"><button class="btn primary" id="fixacc">Fix access</button></div><p class="small muted" style="text-align:right">Fixing removes access nobody asked for and adds what is missing.</p>' : (bad ? '<p class="small muted">A master administrator can fix these.</p>' : ''));
      const fx = $('#fixacc'); if (fx) fx.onclick = async () => { if (!confirm('Fix access? People who are shared on a file but should not be will be removed from it.')) return; try { const x = await call('admin.fixAccess'); toast('Access fixed' + (x.removed ? ': ' + x.removed + ' removed' : '')); runAudit(); } catch (e) { toast(e.message, true); } };
    } catch (e) { out.innerHTML = '<div class="alert">' + esc(e.message) + '</div>'; }
  }
};

function userForm(u) {
  const me = state.session.user, isMaster = me.role === 'master', isNew = !u, self = u && u.email === me.email;
  u = u || { email: '', full_name: '', role: 'staff', active: true, parent_access: false, donor_access: false, org_overview: false, caps: [], expires_on: null };
  const canDept = d => isMaster || me.caps.indexOf('users_' + d) >= 0, locked = self ? 'disabled' : '';
  const m = modal('<h2>' + (isNew ? 'Add user' : 'Edit user') + '</h2>' +
    fld('Google account email', '<input id="u-email" type="email" value="' + esc(u.email) + '" ' + (isNew ? '' : 'disabled') + ' placeholder="name@gmail.com">') + fld('Name', '<input id="u-name" value="' + esc(u.full_name) + '">') +
    fld('Role', '<select id="u-role" ' + (self || !isMaster ? 'disabled' : '') + '>' + opt('staff', 'Staff: works in the departments below', u.role === 'staff') + (isMaster ? opt('admin', 'Administrator: manages only what you choose', u.role === 'admin') : '') + (me.owner ? opt('master', 'Master: can do everything', u.role === 'master') : u.role === 'master' ? opt('master', 'Master', true) : '') + '</select>') +
    '<div id="capbox" ' + (u.role === 'admin' ? '' : 'hidden') + '><label>This administrator can manage</label><div class="checks" style="flex-direction:column;align-items:flex-start">' +
      '<label><input type="checkbox" data-cap="users_parent" ' + (u.caps.indexOf('users_parent') >= 0 ? 'checked' : '') + ' ' + locked + '> Parent users (add and manage parent staff; needs Parent access below)</label>' +
      '<label><input type="checkbox" data-cap="users_donor" ' + (u.caps.indexOf('users_donor') >= 0 ? 'checked' : '') + ' ' + locked + '> Donor users (add and manage donor staff; needs Donor access below)</label>' +
      '<label><input type="checkbox" data-cap="audit" ' + (u.caps.indexOf('audit') >= 0 ? 'checked' : '') + ' ' + locked + '> Access log (see changes and check who can open each file)</label></div></div>' +
    '<label>Can open</label><div class="checks" style="flex-direction:column;align-items:flex-start">' +
    '<label><input type="checkbox" id="u-parent" ' + (u.parent_access ? 'checked' : '') + ' ' + (self || !canDept('parent') ? 'disabled' : '') + '> Parent Communication</label>' +
    '<label><input type="checkbox" id="u-donor" ' + (u.donor_access ? 'checked' : '') + ' ' + (self || !canDept('donor') ? 'disabled' : '') + '> Donor Communication</label>' +
    '<label id="ovl"><input type="checkbox" id="u-ov" ' + (u.org_overview ? 'checked' : '') + '> Organisation Overview (totals only; administrators and masters, set by a master)</label></div>' +
    fld('Access until (optional)', '<input id="u-until" type="date" value="' + esc(u.expires_on || '') + '" ' + locked + '>') + '<p class="small muted" style="margin-top:4px">After this date access stops by itself. Leave empty for no end date. Good for volunteers, interns and contractors.</p>' +
    '<label class="inline"><input type="checkbox" id="u-active" ' + (u.active ? 'checked' : '') + ' ' + locked + '> Active (can sign in)</label>' +
    '<p class="small muted">' + (self ? (u.owner ? 'You are the owner. Your access is permanent. You can change your name.' : 'You cannot change your own role, status or access. Ask another administrator.') : isMaster ? 'Saving shares or unshares the matching Google Sheets, and the person may get an email from Google about it.' : 'You can manage ordinary staff in the departments you administer. Saving shares or unshares the matching Google Sheets, and the person may get an email from Google about it.') + '</p><div id="uerr"></div>' +
    '<div class="actions"><button class="btn" id="x">Cancel</button><button class="btn primary" id="s">' + (isNew ? 'Add user' : 'Save changes') + '</button></div>', true);
  const syncRole = () => {
    const r = $('#u-role', m).value; $('#capbox', m).hidden = r !== 'admin';
    const ov = $('#u-ov', m), canOv = !self && isMaster && r !== 'staff'; ov.disabled = !canOv; if (!canOv && r === 'staff') ov.checked = false;
    if (r === 'master') { ['#u-parent', '#u-donor', '#u-ov'].forEach(id => { $(id, m).checked = true; $(id, m).disabled = true; }); }
  };
  $('#u-role', m).onchange = syncRole; syncRole(); $('#x', m).onclick = m.close;
  $('#s', m).onclick = async () => {
    const role = $('#u-role', m).value;
    try {
      const r = await call('admin.users.save', { email: val('u-email').trim(), full_name: val('u-name').trim(), role, active: $('#u-active', m).checked, parent_access: $('#u-parent', m).checked, donor_access: $('#u-donor', m).checked,
        org_overview: $('#u-ov', m).checked, caps: role === 'admin' ? $$('[data-cap]', m).filter(c => c.checked).map(c => c.dataset.cap) : [], expires_on: val('u-until') });
      m.close();
      if (r.warnings.length) { const w = modal('<h2>Saved, but check the sharing</h2><div class="alert">' + r.warnings.map(esc).join('<br>') + '</div><p class="small muted">The person is saved. Use Check access on the Users and access page to see exactly who can open each file.</p><div class="actions"><button class="btn primary" id="x">OK</button></div>'); $('#x', w).onclick = w.close; }
      else toast((isNew ? 'User added' : 'Saved') + '. File sharing updated');
      views['admin/users']();
    } catch (e) { $('#uerr', m).innerHTML = errorsHtml(e); }
  };
}

// ---------- logo (imported from Drive by the project owner) ----------
function applyLogo() {
  if (!LOGO) return;
  const probe = new Image();
  probe.onload = () => {
    document.documentElement.dataset.logo = probe.naturalWidth / probe.naturalHeight > 2.2 ? 'wide' : 'square';
    $$('.mark').forEach(svg => { const i = document.createElement('img'); i.className = 'mark-img'; i.src = LOGO; i.alt = ''; svg.replaceWith(i); });
    const sp = $('.sp-in'); if (sp) { const big = document.createElement('img'); big.className = 'sp-logo'; big.src = LOGO; big.alt = 'Ek Tara'; sp.insertBefore(big, sp.firstChild); }
  };
  probe.src = LOGO;   // if the image cannot be read the built-in mark stays
}
applyLogo();
initChrome();
showLanding({}).then(hideSplash, hideSplash);
setTimeout(() => { if (document.getElementById('splash') && !document.getElementById('splash').classList.contains('out')) window.__bootFail('The server has not answered after ' + Math.round(BOOT_WATCH_MS / 1000) + ' seconds. Check that both deployments use the newest version.'); }, BOOT_WATCH_MS);
</script>
